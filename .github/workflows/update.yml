name: อัปเดตข้อมูลหุ้นทุกวัน

on:
  schedule:
    # 22:30 UTC วันจันทร์–ศุกร์ = 05:30 น. เวลาไทย วันอังคาร–เสาร์ (หลังตลาดสหรัฐปิด)
    - cron: "30 22 * * 1-5"
  workflow_dispatch: {}   # มีปุ่ม "Run workflow" ให้กดรันเองได้

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: ติดตั้งไลบรารี
        run: pip install -r requirements.txt

      - name: ดึงราคาปิดและงบ คำนวณข้อมูล
        run: python scanner.py

      - name: บันทึกไฟล์ข้อมูลใหม่
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          if git diff --cached --quiet; then
            echo "ข้อมูลไม่เปลี่ยน"
          else
            git commit -m "อัปเดตข้อมูลหุ้น $(date -u +%Y-%m-%d)"
            git push
          fi
