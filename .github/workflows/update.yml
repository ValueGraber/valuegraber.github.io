name: อัปเดตข้อมูลหุ้นทุกวัน

on:
  schedule:
    # ลองทุก 30 นาที ช่วง 05:07–10:07 น. เวลาไทย วันอังคาร–เสาร์ (หลังตลาดสหรัฐปิด)
    # GitHub มักเริ่มรอบตามเวลาช้าหรือข้ามไป และบางวัน Yahoo ยังไม่มีราคาปิด จึงลองหลายรอบ
    # แต่ละรอบเช็กก่อน (tools/fresh.py) ถ้ามีราคาปิดล่าสุดแล้วจะข้าม จบภายในไม่กี่วินาที
    # ใช้นาทีที่ 7 และ 37 เพราะต้นชั่วโมงคนใช้ GitHub เยอะ รอบมักช้ากว่า
    - cron: "7,37 22-23 * * 1-5"   # 05:07–06:37 น. เวลาไทย
    - cron: "7,37 0-2 * * 2-6"     # 07:07–09:37 น. เวลาไทย
    - cron: "7 3 * * 2-6"          # 10:07 น. เวลาไทย รอบสุดท้ายของวัน
  workflow_dispatch: {}   # มีปุ่ม "Run workflow" ให้กดรันเองได้ รันเองจะดึงข้อมูลเสมอ ไม่เช็กก่อน

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: เช็กว่ามีราคาปิดล่าสุดแล้วหรือยัง
        id: fresh
        if: github.event_name == 'schedule'
        run: python3 tools/fresh.py

      - uses: actions/setup-python@v5
        if: steps.fresh.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: ติดตั้งไลบรารี
        if: steps.fresh.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: ดึงราคาปิดและงบ คำนวณข้อมูล
        if: steps.fresh.outputs.skip != 'true'
        run: python scanner.py

      - name: บันทึกไฟล์ข้อมูลใหม่
        if: steps.fresh.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/
          if git diff --cached --quiet; then
            echo "ข้อมูลไม่เปลี่ยน"
          else
            git commit -m "อัปเดตข้อมูลหุ้น $(date -u +%Y-%m-%d)"
            git pull --rebase -q && git push
          fi
