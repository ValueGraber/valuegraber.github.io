name: สัญญาณเก็งกำไรหุ้น (ทุก 30 นาทีช่วงตลาดเปิด)

on:
  schedule:
    # ตลาดสหรัฐเปิด 21:30–04:00 น. เวลาไทย (หน้าร้อน 20:30–03:00) = 13:30–21:00 UTC
    # tools/swing.py เช็กเวลานิวยอร์กเองและข้ามถ้าตลาดปิด (จบในไม่กี่วินาที)
    - cron: "7,37 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: swing
  cancel-in-progress: false

jobs:
  swing:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: ติดตั้งไลบรารี
        run: pip install -r requirements.txt
      - name: สแกนกราฟ 1 ชม.
        run: python tools/swing.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}
      - name: บันทึกไฟล์
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/swing.json docs/swing-log.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "ไม่มีอะไรเปลี่ยน"; exit 0; fi
          git commit -m "สัญญาณเก็งกำไร $(date -u +%H:%M) UTC"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
