<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>สมุดสวนทุเรียน</title>
<meta name="theme-color" content="#16342a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="สวนทุเรียน">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --rail:#16342a; --rail-2:#1f4537; --rail-ink:#e4eee6; --rail-dim:#9fb8a8;
  --ground:#edf1eb; --surface:#fbfcf9; --sunk:#e3e9e1;
  --ink:#18231d; --ink-2:#47574d; --ink-3:#6b7a70; --line:#d3dcd2;
  --yellow:#f2bf35; --yellow-2:#e2ab1c; --yellow-ink:#3a2a00;
  --in:#2b7a47; --out:#b2412d;
  --st-young:#8aa7b8; --st-rest:#4e8a5a; --st-induce:#b5773a; --st-bud:#d9b540; --st-bloom:#e9d48e; --st-fruit:#93a336; --st-cut:#8b918c;
  --r:10px; --font:"Sarabun",system-ui,sans-serif; --num:"Barlow Condensed","Sarabun",sans-serif;
  --shadow:0 1px 2px rgba(20,40,28,.08),0 4px 14px rgba(20,40,28,.06);
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:16px;line-height:1.55;color:var(--ink);background:var(--ground);-webkit-font-smoothing:antialiased}
::selection{background:var(--yellow);color:var(--yellow-ink)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--yellow);outline-offset:2px;border-radius:6px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* shell */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.rail{background:var(--rail);color:var(--rail-ink);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}
.brand .mark{width:34px;height:34px;border-radius:9px;background:var(--yellow);display:grid;place-items:center;color:var(--rail)}
.brand b{display:block;font-size:17px;line-height:1.2}
.brand small{display:block;color:var(--rail-dim);font-size:13px}
.add-main{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--yellow);color:var(--yellow-ink);border:0;border-radius:var(--r);padding:12px;font-weight:700;font-size:16px;cursor:pointer;margin:0 0 14px;box-shadow:0 2px 0 var(--yellow-2)}
.add-main:hover{background:#f6ca4f}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:9px;color:var(--rail-ink);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--rail-2)}
.nav a[aria-current=page]{background:var(--rail-2);box-shadow:inset 3px 0 0 var(--yellow)}
.nav a[aria-current=page] svg{color:var(--yellow)}
.rail .foot{margin-top:auto;font-size:13px;color:var(--rail-dim);padding:8px}
.rail .foot a{color:var(--rail-ink)}
main{padding:28px 36px 60px;max-width:1120px;width:100%}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
h1{font-size:28px;line-height:1.2;margin:0;font-weight:700}
.top p{margin:4px 0 0;color:var(--ink-2)}
h2{font-size:19px;margin:0;font-weight:700}
.sec{margin-top:30px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h a,.link{color:var(--rail);font-weight:600;text-decoration:underline;text-underline-offset:3px;background:none;border:0;padding:0;cursor:pointer}
.mob-top,.tabbar,.fab{display:none}

/* surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.money{display:grid;grid-template-columns:repeat(3,1fr);overflow:hidden}
.money>div{padding:18px 22px;border-right:1px solid var(--line)}
.money>div:last-child{border-right:0;background:var(--rail);color:var(--rail-ink)}
.money span{display:block;font-size:14px;color:var(--ink-2)}
.money>div:last-child span{color:var(--rail-dim)}
.money b{font-family:var(--num);font-size:38px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.money .in b{color:var(--in)} .money .out b{color:var(--out)}
.money small{display:block;color:var(--ink-3);font-size:13px}
.money>div:last-child small{color:var(--rail-dim)}

/* tree tag: the signature */
.tag{--st:var(--st-rest);position:relative;display:inline-flex;align-items:center;gap:6px;min-width:58px;height:36px;padding:0 10px 4px 22px;border-radius:7px 7px 7px 7px;
  background:linear-gradient(180deg,#f1f3f1 0%,#d9ddd9 55%,#cdd2cd 100%);border:1px solid #b9c0b9;color:#1e2722;font-family:var(--num);font-weight:700;font-size:20px;line-height:1;
  box-shadow:0 1px 1px rgba(0,0,0,.08),inset 0 1px 0 rgba(255,255,255,.8);overflow:hidden;cursor:pointer;user-select:none;justify-content:center}
.tag::before{content:"";position:absolute;left:8px;top:calc(50% - 2px);transform:translateY(-50%);width:7px;height:7px;border-radius:50%;background:var(--ground);box-shadow:inset 0 1px 2px rgba(0,0,0,.35)}
.tag::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--st)}
.tag small{font-family:var(--font);font-size:12px;font-weight:500;color:var(--ink-2)}
.tag.sm{height:26px;min-width:44px;font-size:16px;padding:0 7px 3px 18px;border-radius:6px}
.tag.sm::before{left:6px;width:5px;height:5px}
.tag.sm::after{height:3px}
.tag.lg{height:84px;min-width:120px;font-size:52px;padding:0 20px 10px 40px;border-radius:12px}
.tag.lg::before{left:14px;width:13px;height:13px}
.tag.lg::after{height:10px}
.tag[aria-pressed=true]{background:linear-gradient(180deg,#ffe58f,#f2bf35);border-color:#c9970f;color:var(--yellow-ink)}
.tag:hover{border-color:#8f988f}
.tag.mg{color:#5a1f45;background:linear-gradient(180deg,#f3eff2 0%,#ddd5db 55%,#d1c7cf 100%);border-color:#bba9b6}
.tag.mg[aria-pressed=true]{background:linear-gradient(180deg,#ffe58f,#f2bf35);color:var(--yellow-ink)}
.tags{display:flex;flex-wrap:wrap;gap:8px}
.st-young{--st:var(--st-young)} .st-rest{--st:var(--st-rest)} .st-induce{--st:var(--st-induce)} .st-bud{--st:var(--st-bud)} .st-bloom{--st:var(--st-bloom)} .st-fruit{--st:var(--st-fruit)} .st-cut{--st:var(--st-cut)}
.dot{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--st);vertical-align:middle;margin-right:6px}

/* soon to cut */
.soon{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.soon .it{padding:14px;display:flex;gap:12px;align-items:center;cursor:pointer}
.soon .it:hover{border-color:#a9b5a9}
.soon .it>div>b{font-family:var(--num);font-size:26px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.soon .it>div>span{font-size:13px;color:var(--ink-2)}
.late b{color:var(--out)}

/* lists */
.list{list-style:none;margin:0;padding:0}
.list>li{display:grid;grid-template-columns:92px 1fr auto;gap:14px;align-items:start;padding:14px 18px;border-bottom:1px solid var(--line)}
.list>li:last-child{border-bottom:0}
.list .d{color:var(--ink-2);font-size:14px;padding-top:2px}
.list .t{font-weight:600}
.list .s{color:var(--ink-2);font-size:14px;margin-top:2px}
.list .tags{margin-top:8px;gap:5px}
.list .amt{font-family:var(--num);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.list .amt.in{color:var(--in)} .list .amt.out{color:var(--out)}
.list li.click{cursor:pointer}.list li.click:hover{background:#f3f6f1}
.kind{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);background:var(--sunk);border-radius:6px;padding:1px 8px;margin-right:6px}

/* controls */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;font-weight:600;cursor:pointer;min-height:44px}
.btn:hover{border-color:#a9b5a9;background:#fff}
.btn.pri{background:var(--rail);color:#fff;border-color:var(--rail)}
.btn.pri:hover{background:var(--rail-2)}
.btn.yel{background:var(--yellow);border-color:var(--yellow-2);color:var(--yellow-ink)}
.btn.danger{color:var(--out)}
.btn.danger.arm{background:var(--out);color:#fff;border-color:var(--out)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;border-radius:8px;padding:7px 14px;font-weight:600;color:var(--ink-2);cursor:pointer;min-height:38px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
select.f,input.f,textarea.f{width:100%;border:1px solid #c3cdc2;background:#fff;border-radius:9px;padding:10px 12px;min-height:46px}
textarea.f{min-height:70px;resize:vertical}
input.f:focus,select.f:focus,textarea.f:focus{outline:none;border-color:var(--rail);box-shadow:0 0 0 3px rgba(242,191,53,.5)}
label.l{display:block;font-weight:600;font-size:15px;margin:0 0 6px}
label.l small{font-weight:400;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.fld{margin-bottom:16px}

/* stage board */
.stages{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}
.stages button{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 10px 12px;text-align:left;cursor:pointer;position:relative;overflow:hidden}
.stages button::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:var(--st)}
.stages button[aria-pressed=true]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.stages b{display:block;font-family:var(--num);font-size:30px;line-height:1}
.stages span{font-size:13px;color:var(--ink-2)}
.prog{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--st-fruit)}
.fl-table{width:100%;border-collapse:collapse}
.fl-table th{font-size:13px;color:var(--ink-3);font-weight:600;text-align:left;padding:10px 16px;border-bottom:1px solid var(--line)}
.fl-table td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
.fl-table tr:last-child td{border-bottom:0}
.fl-table tr{cursor:pointer}.fl-table tbody tr:hover{background:#f3f6f1}
.fl-table .r{text-align:right}

/* tree grid */
.rowblock{padding:16px 18px;border-bottom:1px solid var(--line)}
.rowblock:last-child{border-bottom:0}
.rowblock h3{font-size:14px;margin:0 0 10px;color:var(--ink-2);font-weight:600}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--ink-2)}

/* sheet */
dialog.sheet{border:0;padding:0;border-radius:16px;width:min(640px,96vw);max-height:92vh;background:var(--surface);color:var(--ink);box-shadow:0 24px 60px rgba(10,30,20,.35)}
dialog.sheet::backdrop{background:rgba(14,32,24,.45)}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 22px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:2}
.sh-b{padding:20px 22px;overflow:auto}
.sh-f{display:flex;gap:10px;justify-content:space-between;padding:14px 22px;border-top:1px solid var(--line);position:sticky;bottom:0;background:var(--surface)}
.ib{border:0;background:var(--sunk);width:40px;height:40px;border-radius:10px;display:grid;place-items:center;cursor:pointer}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:7px;max-height:250px;overflow:auto;padding:10px;background:var(--sunk);border-radius:10px}
.pick .tag{width:100%}
.choose{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choose button{display:flex;align-items:center;gap:12px;text-align:left;padding:16px;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;min-height:72px}
.choose button:hover{border-color:var(--rail);background:#f5f8f3}
.choose button .ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);color:var(--rail);flex:none}
.choose b{display:block}.choose small{color:var(--ink-2);font-size:13px;line-height:1.35;display:block}
.lines{width:100%;border-collapse:collapse}
.lines td,.lines th{padding:4px 4px;text-align:left;font-size:14px}
.lines th{color:var(--ink-3);font-weight:600}
.total{display:flex;justify-content:space-between;align-items:baseline;background:var(--rail);color:var(--rail-ink);padding:12px 16px;border-radius:10px;margin-top:6px}
.total b{font-family:var(--num);font-size:30px;font-variant-numeric:tabular-nums}

.empty{padding:30px 24px;text-align:center;color:var(--ink-2)}
.empty h3{color:var(--ink);font-size:18px;margin:0 0 6px}
.empty p{margin:0 auto 16px;max-width:46ch}
.note{background:#fff7dc;border:1px solid #ecd58a;border-radius:10px;padding:10px 14px;font-size:14px;color:#5a4508;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;transition:.22s cubic-bezier(.2,.8,.2,1);pointer-events:none;z-index:50;font-weight:500}
.toast.on{opacity:1;transform:translate(-50%,0)}
.muted{color:var(--ink-3)}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:0}
.sum3>div{padding:14px 18px;border-right:1px solid var(--line)}.sum3>div:last-child{border:0}
.sum3 span{font-size:13px;color:var(--ink-2);display:block}.sum3 b{font-family:var(--num);font-size:28px;font-variant-numeric:tabular-nums}
.lastw{grid-template-columns:repeat(var(--n),1fr)}
.lab{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:16px;align-items:start}
.lab #mixres{position:sticky;top:16px}
.pad{padding:18px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 84px 92px 40px;gap:6px;margin-bottom:8px;align-items:center}
.mrow .f{min-height:44px;padding:8px 10px}
.steps{list-style:none;counter-reset:st;margin:0 0 6px;padding:0}
.steps>li{counter-increment:st;display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding:11px 0;border-bottom:1px dashed var(--line)}
.steps>li:last-child{border-bottom:0}
.steps>li::before{content:counter(st);width:28px;height:28px;border-radius:50%;background:var(--rail);color:#fff;display:grid;place-items:center;font-family:var(--num);font-weight:700;font-size:16px}
.steps>li.water::before{background:#4f86a8}
.steps .s{color:var(--ink-2);font-size:14px}
.steps .q{font-family:var(--num);font-size:22px;font-weight:700;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums}
.res-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;background:var(--rail);color:var(--rail-ink);padding:14px 18px;border-radius:12px 12px 0 0}
.res-top b{font-family:var(--num);font-size:32px}
.res-top span{color:var(--rail-dim);font-size:14px}
.costs{display:grid;grid-template-columns:repeat(var(--n,3),1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0}
.costs>div{padding:10px 12px;border-right:1px solid var(--line)}.costs>div:last-child{border-right:0}
.costs span{display:block;font-size:13px;color:var(--ink-2)}.costs b{font-family:var(--num);font-size:24px;font-variant-numeric:tabular-nums}
.costs .hl{background:#fff7dc}
.warns{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:6px}
.warns li{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:#fbeae6;color:#6e2414;font-size:14.5px}
.warns li.warn{background:#fdf3d4;color:#5a4508}
.warns li .badge{flex:none}
.scale{display:grid;grid-template-columns:1fr 28px 1fr;gap:6px;align-items:start}
.scale .arrow{font-size:24px;color:var(--ink-3);padding-top:38px;text-align:center}
.uin{position:relative}.uin span{position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:14px;pointer-events:none}.uin input{padding-right:46px}
.qk{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}
.qkb{border:1px solid var(--line);background:#fff;border-radius:7px;padding:3px 9px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;min-height:30px}
.qkb[aria-pressed=true]{background:var(--rail);color:#fff;border-color:var(--rail)}
.ratio{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;background:#fff7dc;border:1px solid #ecd58a;border-radius:10px;padding:10px 14px;margin:0 0 16px}
.ratio b{font-size:18px;color:#5a4508}.ratio span{font-size:14px;color:#5a4508}
.nut{display:grid;grid-template-columns:auto repeat(3,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:8px 0 4px;font-size:14px}
.nut>div{padding:8px 10px;border-bottom:1px solid var(--line)}.nut>div:nth-last-child(-n+4){border-bottom:0}
.nut .h{background:var(--sunk);font-weight:700;color:var(--ink-2);font-size:13px}
.nut .v{font-family:var(--num);font-size:20px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.calc{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.blend li{grid-template-columns:1fr auto auto!important;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips label{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;cursor:pointer;font-size:14px}
.chips label:has(input:checked){background:#e3eee4;border-color:var(--rail)}
.chips input{accent-color:var(--rail);width:16px;height:16px;margin:0}
.badge{display:inline-block;font-size:12.5px;font-weight:700;line-height:1.5;border-radius:6px;padding:1px 8px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.badge.bad{background:#f6dcd6;color:#8f2a17}.badge.warn{background:#fbedc0;color:#6b4d00}.badge.ok{background:#dcefe0;color:#1d5c33}
.stk tbody tr{cursor:default}.stk tbody tr:hover{background:none}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.photos figure{margin:0}.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;cursor:zoom-in;display:block;background:var(--sunk)}
.photos figure.big{grid-column:1/-1}.photos figure.big img{aspect-ratio:auto;object-fit:contain;cursor:zoom-out;max-height:70vh}
.photos figcaption{font-size:13px;color:var(--ink-3);margin-top:2px}
.mapwrap{overflow:auto;border-radius:12px;border:1px solid var(--line);background:var(--sunk);-webkit-overflow-scrolling:touch}
.map{position:relative;min-width:880px}.map.edit{cursor:crosshair}
.map img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.pin{position:absolute;transform:translate(-50%,-50%);cursor:pointer;line-height:0}
.pin .tag{box-shadow:0 2px 8px rgba(0,0,0,.5)}
.pin.sel .tag,.pinpick.sel .tag{outline:3px solid var(--yellow);outline-offset:2px}
.pinpick{cursor:pointer;line-height:0}
.yb{display:block;height:8px;border-radius:3px;background:var(--st-fruit)}
.skel{height:64px;border-radius:12px;background:linear-gradient(90deg,var(--sunk),#eef2ec,var(--sunk));background-size:200% 100%;animation:sk 1.2s infinite linear;margin-bottom:10px}
@keyframes sk{to{background-position:-200% 0}}
.cat-bars{padding:6px 18px 14px}
.cat-bars div{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;font-size:14px;padding:5px 0}
.cat-bars i{display:block;height:10px;border-radius:3px;background:var(--out);opacity:.75}
.cat-bars em{font-style:normal;text-align:right;font-family:var(--num);font-size:17px;font-weight:600}

.gate .rail,.gate .tabbar,.gate .fab,.gate .mob-top{display:none!important}

function cropOfIds(ids){ids=(ids||[]).filter(id=>S.data.trees[id]);if(!ids.length)return {crop:'ทั้งสวน',mg:null};const n=ids.filter(id=>isMg(S.data.trees[id])).length;return {crop:n===0?'ทุเรียน':n===ids.length?'มังคุด':'ทั้งสวน',mg:n/ids.length}}
const cropMg=c=>c==='มังคุด'?1:c==='ทุเรียน'?0:null;
function mgShare(){const p=planMeta();if(p.mgShare!=null&&p.mgShare!=='')return Math.max(0,Math.min(100,+p.mgShare))/100;const a=trees();return a.length?a.filter(isMg).length/a.length:0}
function ledgerFor(crop){const L=ledger();if(!crop||crop==='ทั้งสวน')return L;const d=mgShare();
  return L.map(r=>{const m=r.mg==null?d:r.mg,f=crop==='มังคุด'?m:1-m;return f>0?{...r,amount:r.amount*f,part:f<1}:null}).filter(Boolean)}

const CHANNELS=['Facebook','LINE','TikTok','Shopee/Lazada','ขายหน้าสวน','อื่นๆ'];

 {k:'WG',t:'เม็ด/แกรนูล (WG, WDG, DF)',sh:'เม็ด',r:2,tip:'รอให้เม็ดแตกตัวหมดก่อนใส่ตัวถัดไป'},
 {k:'WP',t:'ผง (WP, SP)',sh:'ผง',r:3,tip:'ละลายในถังเล็กก่อน แล้วค่อยเทลงถัง'},

async function put(c,id,obj){
  if(!S.canWrite){toast('บัญชีนี้ดูได้อย่างเดียว');return false}
  obj={...obj,updated:Date.now()};
  if(!obj.by&&S.me)obj.by=S.me;
  if(S.mode==='cloud'){
    try{const pr=S.db.collection(c).doc(id).set(obj);await Promise.race([pr,new Promise(r=>setTimeout(r,1500))]);pr.catch(()=>toast('บันทึกขึ้น cloud ไม่สำเร็จ'));return true}
    catch(e){
      if(e&&e.code==='invalid_argument'&&!S.writeProven){S.canWrite=false;render();toast('บัญชีนี้ดูได้อย่างเดียว');return false}
      if(e&&e.code==='quota_exceeded'){toast('พื้นที่เก็บข้อมูลเต็ม ลองลบรายการเก่าที่ไม่ใช้');return false}
      if(e&&e.code==='unavailable'){await new Promise(r=>setTimeout(r,600+Math.random()*600));try{await S.db.collection(c).doc(id).set(obj);return true}catch(_){}}
      toast('บันทึกไม่สำเร็จ ลองอีกครั้ง');return false}
  }
  S.data[c][id]=obj;saveLocal();render();return true;
}

}

async function gardenId(name,code){const t=normName(name)+'|'+String(code).trim();
  if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  let h1=0x811c9dc5,h2=0;for(const ch of t){h1=Math.imul(h1^ch.charCodeAt(0),16777619)>>>0;h2=(h2*31+ch.charCodeAt(0))>>>0}return 'f'+h1.toString(16)+h2.toString(16)}

async function initFB(){if(FS)return FS;if(!hasCloud())throw new Error('noconfig');

async function enter(sess){
  S.session=sess;S.me=sess.who||'';S.canWrite=true;
  if(sess.local){S.mode='local';loadLocal();render();return}
  S.mode='loading';render();
  try{await initFB()}catch(e){S.mode='login';S.loginErr=e.message==='noconfig'?'ยังไม่ได้ตั้งค่า cloud ของเว็บนี้':fbMsg(e);render();return}
  const root=FS.collection('gardens').doc(sess.gid);
  S.db={collection:c=>root.collection(c)};S.mode='cloud';S.loaded=new Set();
  const timer=setTimeout(()=>{S.stale=true;if(S.loaded.size<COLLS.length){S.loaded=new Set(COLLS)};render()},10000);
  COLLS.forEach(c=>{
    UNSUBS.push(S.db.collection(c).onSnapshot({includeMetadataChanges:false},snap=>{
      const o={};snap.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});S.data[c]=o;
      S.loaded.add(c);if(!snap.metadata.fromCache&&S.loaded.size===COLLS.length){clearTimeout(timer);S.stale=false}
      scheduleRender();
    },err=>{S.loaded.add(c);clearTimeout(timer);S.stale=true;scheduleRender()}));
  });
}

function treeState(){
  const st={};
  trees().forEach(t=>st[t.id]={stage:t.kind==='young'?'young':'rest',date:null,bloom:null,fruits:null});
  list('flowers').sort((a,b)=>(a.date>b.date?1:a.date<b.date?-1:(a.updated||0)-(b.updated||0))).forEach(f=>{
    (f.trees||[]).forEach(id=>{const s=st[id];if(!s)return;
      s.stage=f.stage;s.date=f.date;
      if(f.stage==='induce'||f.stage==='rest'){s.bloom=null;s.fruits=null}
      if(f.stage==='bloom')s.bloom=f.date;
      if(f.stage==='fruit'&&f.fruits)s.fruits=f.fruits;
    });
  });
  list('works').forEach(w=>{const p=+w.phi||0;if(!p)return;const until=addDays(w.date,p);(w.trees||[]).forEach(id=>{const s=st[id];if(s&&(!s.safe||until>s.safe)){s.safe=until;s.safeW=w}})});
  const t0=today();
  Object.entries(st).forEach(([id,s])=>{const t=S.data.trees[id];
    if(s.bloom&&['bloom','fruit','bud'].includes(s.stage)){const d=daysFor(t.variety);s.cutDate=addDays(s.bloom,d);s.left=daysBetween(t0,s.cutDate);s.total=d;s.age=daysBetween(s.bloom,t0)}
    if(s.safe&&s.safe>t0)s.inPhi=true;if(s.inPhi&&s.cutDate&&s.cutDate<s.safe)s.phiWarn=true;
  });
  return st;
}

function schedules(){const last={};list('works').forEach(w=>{const k=w.type+'|'+(w.product||'').trim();if(!last[k]||w.date>last[k].date||(w.date===last[k].date&&(w.updated||0)>(last[k].updated||0)))last[k]=w});
  const ev={};list('works').forEach(w=>{if(+w.every>0){const k=w.type+'|'+(w.product||'').trim();if(!ev[k]||w.date>ev[k].date)ev[k]=w}});
  return Object.entries(ev).map(([k,e])=>{const w=last[k];const every=+(w.every||e.every);const next=addDays(w.date,every);return {w:{...w,every},next,left:daysBetween(today(),next)}}).sort((a,b)=>a.left-b.left)}
function stockLevels(){const m={};list('stock').forEach(k=>{const n=(k.item||'').trim();if(!n)return;const o=m[n]=m[n]||{item:n,unit:k.unit,kind:k.kind,inQ:0,used:0};o.inQ+=+k.qty||0;o.unit=o.unit||k.unit});
  list('works').forEach(w=>{const n=(w.product||'').trim();if(n&&m[n]&&+w.useQty)m[n].used+=+w.useQty;
    (w.uses||[]).forEach(u=>{const o=m[(u.item||'').trim()];if(!o||!(+u.qty))return;const a=toBase(+u.qty,u.unit),b=toBase(1,o.unit);if(a.d===b.d)o.used+=a.v/b.v;else if(u.unit===o.unit)o.used+=+u.qty})});
  return Object.values(m).map(o=>({...o,left:o.inQ-o.used,low:o.inQ-o.used<=o.inQ*0.15})).sort((a,b)=>a.left/(a.inQ||1)-b.left/(b.inQ||1))}
const dueTxt=l=>l<0?'เลย '+(-l)+' วัน':l===0?'วันนี้':'อีก '+l+' วัน';
const unitOf=p=>{const o=stockLevels().find(o=>o.item===(p||'').trim());return o?o.unit||'':''};

function bloomRounds(st,mg){const ds=trees().filter(t=>!!mg===isMg(t)).map(t=>({t,s:st[t.id]})).filter(o=>o.s.bloom&&['bloom','fruit','bud'].includes(o.s.stage)).sort((a,b)=>a.s.bloom<b.s.bloom?-1:1);
  const R=[];ds.forEach(o=>{const r=R[R.length-1];if(r&&daysBetween(r.b,o.s.bloom)<=10)r.ids.push(o.t.id);else R.push({b:o.s.bloom,ids:[o.t.id],v:o.t.variety})});return R}
function planTasks(st){const p=planMeta(),T=[];
  if(p.H)(p.mode==='nat'?PLAN_A_NAT:PLAN_A).forEach((x,i)=>T.push({k:'A'+(p.mode==='nat'?'n':'')+':'+p.H+':'+i,date:addDays(p.H,x[0]),ph:'บำรุงต้น/ทำดอก',x}));
  let R=bloomRounds(st);if(!R.length&&p.B)R=[{b:p.B,ids:[],v:'หมอนทอง',plan:true}];
  R.forEach((r,ri)=>{const lbl=(R.length>1?'รุ่น '+(ri+1)+' · ':'')+'ดอกบาน '+fd(r.b,{day:'numeric',month:'short'})+(r.plan?' (คาด)':'');const D=daysFor(r.v||'หมอนทอง');
    PLAN_B.forEach((x,i)=>T.push({k:'B:'+r.b+':'+i,date:addDays(r.b,x[0]),ph:lbl,x,ids:r.ids}));
    PLAN_END.forEach((x,i)=>T.push({k:'E:'+r.b+':'+i,date:addDays(r.b,D+x[0]),ph:lbl,x,ids:r.ids}))});
  const t0=today();return T.map(t=>({...t,done:p.done[t.k],left:daysBetween(t0,t.date)})).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0)}

const wxKey=p=>p.lat!=null?(+p.lat).toFixed(3)+','+(+p.lon).toFixed(3):'';
async function fetchWx(force){const p=planMeta();if(p.lat==null||WX.loading)return;const key=wxKey(p);
  if(!force&&WX.key===key&&WX.d&&Date.now()-WX.at<36e5)return;
  if(!force&&Date.now()-(WX.tried||0)<6e4)return;WX.tried=Date.now();
  WX.loading=true;WX.err='';
  const base='https://api.open-meteo.com/v1/forecast?latitude='+p.lat+'&longitude='+p.lon+'&timezone=Asia%2FBangkok';
  try{const [a,b]=await Promise.all([
      fetch(base+'&past_days=30&forecast_days=16&hourly=temperature_2m,relative_humidity_2m,precipitation_probability,precipitation,wind_speed_10m,wind_gusts_10m,soil_moisture_3_to_9cm,soil_moisture_9_to_27cm&daily=temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_gusts_10m_max,et0_fao_evapotranspiration,relative_humidity_2m_min').then(r=>{if(!r.ok)throw 0;return r.json()}),
      fetch(base+'&forecast_days=10&daily=precipitation_sum&models=ecmwf_ifs025,gfs_seamless,icon_seamless').then(r=>r.ok?r.json():null).catch(()=>null)]);
    WX.d=a;WX.m=b;WX.at=Date.now();WX.key=key;try{localStorage.setItem('durian-wx-v1',JSON.stringify({d:a,m:b,at:WX.at,key}))}catch(_){}}
  catch(_){WX.err='ดึงข้อมูลอากาศไม่ได้ ลองใหม่อีกครั้ง'}
  WX.loading=false;if(ui.view==='plan'||ui.view==='home')render()}
function wxAnalyze(st){const d=WX.d;if(!d||!d.daily)return null;const D=d.daily,Hh=d.hourly,t0=today();
  const iT=D.time.indexOf(t0);if(iT<0)return null;
  const days=D.time.map((t,i)=>({t,mx:D.temperature_2m_max[i],mn:D.temperature_2m_min[i],r:+D.precipitation_sum[i]||0,pp:D.precipitation_probability_max[i],w:D.wind_speed_10m_max[i],g:D.wind_gusts_10m_max[i],et:+D.et0_fao_evapotranspiration[i]||0,rh:D.relative_humidity_2m_min[i]}));

  // spray windows: next 48h, 06-18h, no rain prob>30 in this + next 3h, wind<12, temp<=33
  const now=new Date();const hk=t0+'T'+String(now.getHours()).padStart(2,'0')+':00';let h0=Hh.time.indexOf(hk);if(h0<0)h0=Hh.time.findIndex(t=>t>=hk);
  const good=[];for(let i=Math.max(h0,0);i<Math.min(Hh.time.length,h0+48);i++){const hr=+Hh.time[i].slice(11,13);if(hr<6||hr>17)continue;
    let ok=Hh.wind_speed_10m[i]<12&&Hh.temperature_2m[i]<=33;for(let k=0;k<4&&ok;k++){const j=i+k;if(j>=Hh.time.length)break;if((Hh.precipitation_probability[j]??0)>30||(Hh.precipitation[j]||0)>0.2)ok=false}
    if(ok)good.push(i)}
  const win=[];good.forEach(i=>{const w=win[win.length-1];if(w&&w.e===i-1)w.e=i;else win.push({s:i,e:i})});
  const windows=win.filter(w=>w.e>w.s).map(w=>({day:Hh.time[w.s].slice(0,10),from:Hh.time[w.s].slice(11,16),to:String(+Hh.time[w.e].slice(11,13)+1).padStart(2,'0')+':00',wind:Math.max(...Hh.wind_speed_10m.slice(w.s,w.e+1))}));
  const cur=h0>=0?{t:Hh.temperature_2m[h0],rh:Hh.relative_humidity_2m[h0],pp:Hh.precipitation_probability[h0],w:Hh.wind_speed_10m[h0],sm1:Hh.soil_moisture_3_to_9cm[h0],sm2:Hh.soil_moisture_9_to_27cm[h0]}:null;
  // water balance
  const p=planMeta();const area=Math.PI*Math.pow((+p.canopy||6)/2,2);
  const r30=past.reduce((a,x)=>a+x.r,0),et30=past.reduce((a,x)=>a+x.et,0);
  let dry=0;for(let i=past.length-1;i>=0;i--){if(past[i].r>=5)break;dry++}
  const n7=fut.slice(0,7),r7=n7.reduce((a,x)=>a+x.r,0),et7=n7.reduce((a,x)=>a+x.et,0);

  const stF=(()=>{const R=bloomRounds(st);if(['fruit','bloom','bud'].includes(stage)&&R.length){const age=daysBetween(R[0].b,t0);const D=daysFor(R[0].v||'หมอนทอง');if(age<-7)return [0.75,'ตาดอก 75%'];if(age<14)return [0.25,'ช่วงดอกบาน 20–25%'];if(age<28)return [0.65,'ผลอ่อน 60–70%'];if(age>=D-21)return [0.6,'เริ่มแก่ 60%'];if(age>=70)return [0.85,'ผลโต 85%'];return [0.75,'ผลกำลังโต 75%']}
    if(stage==='induce')return [0,'ช่วงงดน้ำทำดอก'];if(stage==='bud')return [0.75,'ตาดอก 75%'];return [0.6,'สร้างใบ/ต้น 60%']})();
  const need7=Math.max(0,et7*stF[0]-r7*0.8),L7=Math.round(need7*area);
  const A=[];const f10=fut.slice(0,10);
  const big=f10.find(x=>x.r>=50);let roll=null;for(let i=0;i+2<f10.length;i++){const s=f10[i].r+f10[i+1].r+f10[i+2].r;if(s>=100){roll={t:f10[i].t,s};break}}

const GUIDE_HTML="<div class=\"guide\">\n<p class=\"lead\">คู่มือทุเรียนหมอนทอง พื้นที่ราว 2 ไร่ (40–45 ต้น ระยะ 8×8 ม.) ภาคตะวันออก เรียงตามเวลา: เตรียมพื้นที่ → ต้นเล็กปีที่ 1–3 → ปีที่ 4 ทำดอกครั้งแรก → วัฏจักรทำดอกที่วนซ้ำทุกปี ท้ายเล่มเป็นเรื่องยา อากาศ และการจดบันทึก อัตราสารให้ยึดฉลากจริงเป็นหลัก<\/p>\n\n<h2 class=\"g-h\">ช่วงที่ 1 · ก่อนปลูก<\/h2>\n<details><summary>เตรียมพื้นที่และผังปลูก<\/summary>\n<ol>\n<li><b>ตรวจดิน<\/b> เก็บ 10–20 จุด ลึก 0–15 และ 15–30 ซม. ปรับ pH ให้ได้ 5.5–6.5 ด้วยโดโลไมท์<\/li>\n<li><b>ทำเนิน/ยกร่อง<\/b> ที่ดอน: เนินสูง 30–50 ซม. กว้าง 1.5–2 ม. · ที่ลุ่มน้ำท่วมนาน: ยกร่อง สันร่องกว้าง ≥6 ม. ร่องกว้าง 1.5 ม. ลึก 1 ม. มีประตูน้ำเข้า-ออก<\/li>\n<li><b>ผังปลูก<\/b> 8×8 หรือ 9×9 ม. (16–25 ต้น/ไร่) แถวเหนือ-ใต้ ปลูกไม้บังลมด้านมรสุม<\/li>\n<li><b>น้ำ<\/b> บ่อ 600–800 ลบ.ม./ไร่/ปี สปริงเกอร์ 1 หัว/ต้น แยกวาล์วเป็นโซน (ต้องงดน้ำ/ให้น้ำต่างกันตามรุ่นดอก)<\/li>\n<li><b>ต้นพันธุ์<\/b> เสียบบนตอทนรากเน่าหรือเสียบ 2 ราก แทรกพันธุ์ผสมเกสร (ก้านยาว/ชะนี/จันทบุรี 3) 2–3 ต้น<\/li>\n<\/ol><\/details>\n\n<h2 class=\"g-h\">ช่วงที่ 2 · ปีที่ 1–3 สร้างต้น (ยังไม่ทำดอก)<\/h2>\n<p class=\"g-p\">เป้าหมาย: แตกใบอ่อนได้ 4–6 ชุดต่อปี ทรงต้นแข็งแรง รากสะอาด ใช้ N นำ ดอกที่ออกก่อนปีที่ 4 ปลิดทิ้ง<\/p>\n<details><summary>ปีที่ 1 · ตั้งตัว<\/summary>\n<ul>\n<li>พรางแสง 50% (ตาข่ายหรือปลูกกล้วยร่วม) คลุมโคนห่างโคน 15–20 ซม.<\/li>\n<li>ปุ๋ยสูตรเสมอ (15-15-15/16-16-16) 50–100 ก./ต้น ทุก 3–4 สัปดาห์ โรยรอบทรงพุ่ม ปุ๋ยคอก 5–10 กก./ต้น ปีละ 2 ครั้ง<\/li>\n<li>น้ำ: ดินชื้นไม่แฉะ (กำดินแล้วปั้นได้แต่แตกง่าย)<\/li>\n<li>จัดทรง: ลำต้นเดียวตรง ตัดกิ่งต่ำกว่า 80–100 ซม.<\/li>\n<li>ไตรโคเดอร์มาทุก 3–4 เดือน<\/li>\n<\/ul><\/details>\n<details><summary>ปีที่ 2 · สร้างกิ่งหลัก<\/summary>\n<ul>\n<li>ปุ๋ยสูตรเสมอ 200–300 ก./ต้น ทุก 1–2 เดือน ปุ๋ยคอก 10–20 กก./ต้น ปีละ 2 ครั้ง<\/li>\n<li>ค่อย ๆ เอาที่พรางแสงออก<\/li>\n<li>เลือกกิ่งข้างมุมกว้าง (เกือบตั้งฉาก) ห่างกัน 20–30 ซม. เวียนรอบต้น ตัดกิ่งมุมแคบ กิ่งซ้อน<\/li>\n<li>ฟอสโฟเนตช่วงฝนชุก<\/li>\n<\/ul><\/details>\n<details><summary>ปีที่ 3 · ขยายทรงพุ่ม<\/summary>\n<ul>\n<li>ปุ๋ยสูตรเสมอ 300–500 ก./ต้น ทุก 1–2 เดือน ตามขนาดทรงพุ่ม<\/li>\n<li>ตัดยอดคุมความสูงไม่เกิน 6–7 ม. ในอนาคต เปิดกลางพุ่มให้แสงเข้า<\/li>\n<li>ปลายปีเริ่มตรวจความพร้อมสำหรับปีที่ 4 (ดูช่วงที่ 3)<\/li>\n<\/ul><\/details>\n<details><summary>ทำทุกครั้งที่ต้นเล็กแตกใบอ่อน (ปีที่ 1–3)<\/summary>\n<ol>\n<li>ใบเพิ่งแทง: ตรวจเพลี้ยไก่แจ้ หนอนกินใบ พ่นยาฆ่าแมลง 1 ครั้ง (สลับกลุ่ม 4A ↔ 3A)<\/li>\n<li>ใบกางราว 1 สัปดาห์: พ่นกันราใบอ่อน (สลับ M03 ↔ 11)<\/li>\n<li>ใบเพสลาด (เขียวเข้ม แข็ง): ใส่ปุ๋ยรอบถัดไปเพื่อเร่งชุดใหม่<\/li>\n<\/ol>\n<p class=\"muted\">ใบอ่อนที่เสียหายคือโรงงานที่หายไปตลอดอายุใบ<\/p><\/details>\n\n<div class=\"g-cmp\"><h3>ทำสาร กับ ไม่ทำสาร ต่างกันอย่างไร<\/h3>\n<table class=\"fl-table\"><thead><tr><th><\/th><th>ทำสาร (PBZ)<\/th><th>ไม่ทำสาร (ธรรมชาติ)<\/th><\/tr><\/thead><tbody>\n<tr><td>ดอกออก<\/td><td>เร็วกว่า 2–6 สัปดาห์ ออกพร้อมกัน รุ่นน้อย<\/td><td>ช้ากว่า ทยอยออกหลายรุ่น ขึ้นกับว่าปีนั้นแล้งไหม<\/td><\/tr>\n<tr><td>ความแน่นอน<\/td><td>คุมได้มากกว่า แต่ยังต้องมีช่วงแล้ง<\/td><td>ปีที่ฝนลากยาวอาจออกน้อยหรือไม่ออก<\/td><\/tr>\n<tr><td>ผล<\/td><td>ก้านผลสั้นลง ต้นอายุน้อยมีแนวโน้มผลเล็ก<\/td><td>ก้านผลยาวตามปกติ ไม่มีสารตกค้างในดิน<\/td><\/tr>\n<tr><td>เก็บเกี่ยว<\/td><td>ราว เม.ย.–พ.ค.<\/td><td>ราว พ.ค.–มิ.ย.<\/td><\/tr>\n<tr><td>เหมาะกับ<\/td><td>ต้นโตสมบูรณ์ อยากได้ผลเร็ว ขายราคาต้นฤดู<\/td><td>ต้นอายุน้อย ปีแรก ๆ หรือต้นที่โทรม อยากพักต้น<\/td><\/tr>\n<\/tbody><\/table><p class=\"muted\">ขั้น 5–8 (ดอก ติดผล บำรุงผล เก็บเกี่ยว) ทำเหมือนกันทั้งสองแบบ ต่างกันที่ขั้น 3–4 และปีที่ 4<\/p><\/div>\n<h2 class=\"g-h\">ช่วงที่ 3 · ปีที่ 4 ทำดอกครั้งแรก<\/h2>\n<div data-m=\"pbz\">\n<details open><summary>รูทีนปีแรกที่ทำดอก<\/summary>\n<p><b>เช็คความพร้อมก่อน<\/b> (ไม่ผ่านให้บำรุงต่ออีก 1 ปี)<\/p>\n<ul><li>ทรงพุ่มกว้างราว 4 ม. ขึ้นไป มีกิ่งแนวนอนใหญ่พอรับผล<\/li><li>ปีนั้นแตกใบได้ครบ 2 ชุด ใบเขียวเข้มทั้งต้น ไม่มีโคนเน่า<\/li><\/ul>\n<p><b>ลำดับงาน<\/b> (ใช้ขั้นเดียวกับวัฏจักรช่วงที่ 4 แต่เบากว่า)<\/p>\n<ol>\n<li>ต้นฝน (มิ.ย.–ก.ค.) ใส่ปุ๋ย N สูง เร่งใบชุด 1 และชุด 2 ให้แตกพร้อมกันทั้งต้น<\/li>\n<li>ใบชุด 2 เพสลาด (ราว ก.ย.–ต.ค.): พ่น PBZ อัตราต่ำ ~750 ppm หรือปล่อยให้ออกดอกตามธรรมชาติ<\/li>\n<li>สะสมอาหาร 8-24-24 + 0-52-34 แล้วงดน้ำเปิดตาดอกเมื่อฝนหยุด (เหมือนขั้น 3–4 ของวัฏจักร)<\/li>\n<li>ตัดแต่งช่อดอกให้เหลือน้อยกว่าต้นโต เก็บเฉพาะช่อบนกิ่งใหญ่<\/li>\n<li>ไว้ผลน้อย เน้นผลสวยไม่กี่ผล ให้ต้นยังโตต่อได้<\/li>\n<li>หลังเก็บผล ตัดแต่งกิ่งและบำรุงทันที เพื่อเข้าวัฏจักรปีถัดไป<\/li>\n<\/ol>\n<p class=\"muted\">ต้นอายุน้อยที่ได้ PBZ มีแนวโน้มผลเล็กกว่าต้นแก่ และก้านผลสั้นลง จึงใช้อัตราต่ำและไว้ผลน้อยในปีแรก<\/p>\n<\/details>\n<\/div><div data-m=\"nat\">\n<details open><summary>รูทีนปีแรกที่ทำดอก (ไม่ทำสาร)<\/summary>\n<p><b>เช็คความพร้อมก่อน<\/b> (ไม่ผ่านให้บำรุงต่ออีก 1 ปี)<\/p>\n<ul><li>ทรงพุ่มกว้างราว 4 ม. ขึ้นไป มีกิ่งแนวนอนใหญ่พอรับผล<\/li><li>ปีนั้นแตกใบได้ครบ 2 ชุด ใบเขียวเข้มทั้งต้น ไม่มีโคนเน่า<\/li><\/ul>\n<p><b>ลำดับงาน<\/b><\/p>\n<ol>\n<li>ต้นฝน (มิ.ย.–ก.ค.) ใส่ปุ๋ย N สูง เร่งใบชุด 1 และชุด 2 ให้แตกพร้อมกันทั้งต้น และให้ชุด 2 เพสลาดก่อนปลายฝน<\/li>\n<li>ใบชุด 2 เพสลาด: งด N ใส่ 8-24-24 ทางดิน พ่น 0-52-34 ทุก 7–10 วัน 3 ครั้ง ไม่พ่น PBZ<\/li>\n<li>หมดฝน: งดน้ำตามแล้งธรรมชาติ 15–30 วัน จนเห็นตาดอก แล้วค่อยให้น้ำทีละน้อย<\/li>\n<li>ดอกจะทยอยออก เลือกเก็บรุ่นหลักรุ่นเดียว ตัดแต่งช่อให้เหลือน้อย<\/li>\n<li>ไว้ผลน้อย เน้นผลสวยไม่กี่ผล ให้ต้นยังโตต่อได้<\/li>\n<li>หลังเก็บผล ตัดแต่งกิ่งและบำรุงทันที<\/li>\n<\/ol>\n<p class=\"muted\">ปีแรกไม่ทำสารเป็นทางที่ปลอดภัยกับต้นกว่า ถ้าปีนั้นไม่ออกดอก ต้นได้โตต่ออีกปี<\/p>\n<\/details>\n<\/div>\n\n\n<h2 class=\"g-h\">ช่วงที่ 4 · วัฏจักรทำดอก (ทำซ้ำทุกปี)<\/h2>\n<p class=\"g-p\">นับ \"วันที่ 0\" = วันตัดแต่งกิ่งหลังเก็บเกี่ยว และ \"ดอกบาน\" = วันดอกบานของแต่ละรุ่น หน้า <b>ตารางงาน<\/b> คำนวณวันให้อัตโนมัติ ใช้สภาพต้นเป็นตัวกำหนดเสมอ ไม่ใช่วันที่ในปฏิทิน<\/p>\n<div data-m=\"pbz\"><div class=\"g-flow\"><span>1 ฟื้นต้น<\/span><span>2 ใบ 2 ชุด<\/span><span>3 PBZ + สะสมอาหาร<\/span><span>4 เปิดตาดอก<\/span><span>5 ดอก<\/span><span>6 ติดผล<\/span><span>7 บำรุงผล<\/span><span>8 เก็บเกี่ยว<\/span><\/div><\/div>\n<div data-m=\"nat\"><div class=\"g-flow\"><span>1 ฟื้นต้น<\/span><span>2 ใบ 2 ชุด<\/span><span>3 สะสมอาหาร<\/span><span>4 แล้งเปิดตาดอก<\/span><span>5 ดอก<\/span><span>6 ติดผล<\/span><span>7 บำรุงผล<\/span><span>8 เก็บเกี่ยว<\/span><\/div><\/div>\n<details><summary>ขั้น 1 · ฟื้นต้นหลังเก็บเกี่ยว · วันที่ 0–7 (มิ.ย.–ก.ค.)<\/summary>\n<ul><li>ตัดกิ่งแห้ง กิ่งกระโดง กิ่งซ้อน ทาแผลสารทองแดง (M01)<\/li><li>ปุ๋ย N สูง เช่น 25-7-7 หรือ 15-15-15 + 46-0-0 + ปุ๋ยอินทรีย์ 20–30 กก./ต้น<\/li><li>วันที่ 7: หว่านไตรโคเดอร์มา<\/li><\/ul>\n<p class=\"muted\">ทำไม: N กับ GA ในต้นเร่งให้แตกใบอ่อน ผลดึงธาตุออกไปมาก ผล 1 ตันดึง N 2.19 กก. P 0.42 กก. K 5.37 กก.<\/p><\/details>\n<details><summary>ขั้น 2 · สร้างใบ 2 ชุด · วันที่ 14–60 (ก.ค.–ก.ย.)<\/summary>\n<ul><li>วันที่ 14: ใบชุด 1 แทง → กันเพลี้ยไก่แจ้ (4A)<\/li><li>วันที่ 21: กันราใบอ่อน (M03)<\/li><li>วันที่ 30: ปุ๋ยสูตรเสมอรอบ 2<\/li><li>วันที่ 45: ใบชุด 2 แทง → กันเพลี้ยไก่แจ้ สลับกลุ่ม (3A)<\/li><li>วันที่ 52: กันราใบอ่อน สลับกลุ่ม (11)<\/li><li>วันที่ 60: ฟอสโฟเนต (P07) กันรากเน่าช่วงฝนชุก<\/li><\/ul>\n<p class=\"muted\">ใบแก่ 2 ชุดเต็มต้นคือแหล่งแป้ง-น้ำตาลสำหรับดอกและผลทั้งฤดู<\/p><\/details>\n<div data-m=\"pbz\">\n<details><summary>ขั้น 3 · PBZ + สะสมอาหาร · วันที่ 75–95 (ก.ย.–ต.ค.)<\/summary>\n<ul><li>วันที่ 75: พ่น PBZ 750–1,500 ppm ทางใบ <b>เมื่อใบชุด 2 เพสลาดแล้วเท่านั้น<\/b> (PBZ 10% = 150–300 ก./น้ำ 20 ล.) ไม่ราดดิน<\/li><li>วันที่ 80: 8-24-24 ทางดิน · งด N ทุกชนิด<\/li><li>วันที่ 85 และ 95: 0-52-34 ทางใบ กดใบอ่อน<\/li><\/ul>\n<p><b>สูตรคำนวณ PBZ:<\/b> กรัม = ppm × ลิตรน้ำ ÷ (10 × %สาร)<\/p>\n<p class=\"muted\">ทำไม: PBZ ยับยั้งการสร้าง GA ต้นหยุดแตกใบ P และ K ช่วยสร้างพลังงานและขนน้ำตาล ทำให้ C/N สูง ตาพร้อมเป็นดอก ดอกออกเร็วขึ้น 14–45 วัน แต่ PBZ อย่างเดียวไม่รับประกันดอก (งานวิจัยปี 2024 พ่นแล้วไม่ออก) ต้องมีต้นสมบูรณ์และอากาศแล้งด้วย<\/p><\/details>\n<details><summary>ขั้น 4 · เปิดตาดอก · วันที่ 100–120 (ปลาย ต.ค.–พ.ย.)<\/summary>\n<ul><li>ฝนหยุด → งดน้ำ 14–21 วัน จนใบห่อเล็กน้อยตอนบ่าย<\/li><li>เห็นตาดอก (ตาปู) ตามกิ่ง → ให้น้ำกลับทีละน้อย ห้ามให้เต็มทันที<\/li><li>ฝนตกช่วงนี้: พ่น 0-52-34 ซ้ำ เปิดร่องระบาย<\/li><\/ul>\n<p class=\"muted\">ทำไม: ดินแห้งสั้น ๆ ทำให้ต้นสร้าง ABA ระงับการแตกใบ ถ้าให้น้ำเต็มทันที ตาดอกจะกลายเป็นใบ<\/p><\/details>\n<\/div><div data-m=\"nat\">\n<details><summary>ขั้น 3 · สะสมอาหารแบบไม่ใช้สาร · วันที่ 75–105 (ก.ย.–ต.ค.)<\/summary>\n<ul><li>ใบชุด 2 เพสลาดแล้ว: งด N ทุกชนิด<\/li><li>วันที่ 80: 8-24-24 ทางดิน<\/li><li>วันที่ 85, 95, 105: 0-52-34 ทางใบ กดใบอ่อน (มากกว่าแบบทำสาร 1 ครั้ง เพราะไม่มี PBZ ช่วยหยุดใบ)<\/li><li>ตัดแต่งกิ่งกระโดงที่แตกใหม่ เปิดทรงให้แดดถึงกิ่งด้านใน<\/li><\/ul>\n<p class=\"muted\">ทำไม: ไม่มีสารยับยั้ง GA จึงต้องพึ่งการลด N และ P, K สูง ให้ C/N สูงพอให้ตาเปลี่ยนเป็นดอกเอง ถ้ายังมีใบอ่อนแตก ให้พ่น 0-52-34 ซ้ำจนใบนิ่ง<\/p><\/details>\n<details><summary>ขั้น 4 · เปิดตาดอกตามแล้งธรรมชาติ · วันที่ 110–140 (พ.ย.–ธ.ค.)<\/summary>\n<ul><li>หมดฝน → งดน้ำ 15–30 วัน (นานกว่าแบบทำสาร) จนใบห่อตอนบ่าย<\/li><li>เห็นตาดอก → ให้น้ำกลับทีละน้อย<\/li><li>ดอกทยอยออกหลายรุ่น ให้จดวันดอกบานแต่ละรุ่น ตารางงานจะแยกให้<\/li><li>ฝนลากยาว: พ่น 0-52-34 ซ้ำ รอแล้งรอบถัดไป ปีนั้นอาจได้ดอกช้าหรือน้อย<\/li><\/ul>\n<p class=\"muted\">ทำไม: ความแล้งทำให้ต้นสร้าง ABA ระงับการแตกใบ เป็นตัวกระตุ้นหลักเมื่อไม่ใช้ PBZ หน้า \"อากาศ\" ช่วยดูว่าจะมีช่วงแล้งเมื่อไหร่<\/p><\/details>\n<\/div>\n<details><summary>ขั้น 5 · ตาดอก → ดอกบาน · ดอกบาน −21 ถึง 0 (ธ.ค.–ม.ค.)<\/summary>\n<ul><li>−21 วัน (ระยะหางแย้): ตัดแต่งช่อ เก็บช่อบนกิ่งใหญ่แนวนอน กลุ่มละ 3–5 ช่อ ห่าง 30–50 ซม. เลือกรุ่นหลัก 1–2 รุ่น<\/li><li>−14 วัน: แคลเซียม-โบรอนทางใบ<\/li><li>−10 วัน: กันเพลี้ยไฟ (spinosyn กลุ่ม 5)<\/li><li>วันดอกบาน: ช่วยผสมเกสร 19:00–21:00 น. ใช้เกสรพันธุ์อื่น (จันทบุรี 3 ช่วยให้ติดผลมากขึ้น ลักษณะยังเป็นหมอนทอง)<\/li><\/ul>\n<p class=\"muted\">ลูกเบี้ยวมาจากผสมไม่ทั่ว พูที่มีเมล็ดสร้างฮอร์โมนดึงอาหาร พูที่ไม่มีเมล็ดจะลีบ ที่ 30°C ติดผล 18.7% ที่ 15°C ไม่ติดเลย<\/p><\/details>\n<details><summary>ขั้น 6 · ติดผล และตัดแต่งผล · ดอกบาน +7 ถึง +56<\/summary>\n<table class=\"fl-table\"><thead><tr><th>วัน<\/th><th>งาน<\/th><\/tr><\/thead><tbody>\n<tr><td>+7<\/td><td>แคลเซียม-โบรอน (ไข่ปลา) · ค่อย ๆ เพิ่มน้ำ<\/td><\/tr>\n<tr><td>+10<\/td><td>กันเพลี้ยไฟ สลับกลุ่ม<\/td><\/tr>\n<tr><td>+21<\/td><td>แคลเซียม-โบรอน (มะเขือพวง) · ให้น้ำปกติ<\/td><\/tr>\n<tr><td>+25<\/td><td>ตัดแต่งผลรอบ 1: ผลเล็ก ผิดรูป บนกิ่งเล็ก → เหลือ 2–3 ผล/ช่อ<\/td><\/tr>\n<tr><td>+35<\/td><td>แคลเซียม-โบรอน (หัวกำไล)<\/td><\/tr>\n<tr><td>+40<\/td><td>ตัดแต่งผลรอบ 2: ผลเบี้ยว พูไม่เต็ม หนามแดง → 1–2 ผล/ช่อ<\/td><\/tr>\n<tr><td>+42<\/td><td>กันหนอนเจาะผล (diamide กลุ่ม 28)<\/td><\/tr>\n<tr><td>+49<\/td><td>ตัดแต่งผลรอบ 3 ตามกำลังต้น · โยงกิ่ง · ปุ๋ยสูตรเสมอ + พ่น 13-0-46<\/td><\/tr>\n<tr><td>+56<\/td><td>กันหนอนเจาะผล สลับกลุ่ม<\/td><\/tr><\/tbody><\/table>\n<p class=\"muted\">ช่วงอันตรายคือผลอายุ 3–8 สัปดาห์ ใบอ่อนที่แตกตอนนี้แย่งอาหาร ผลร่วงหรือเบี้ยว เห็นตาใบผลิให้พ่น 13-0-46 หรือ 0-52-34 และหยุด N ทางดิน<\/p><\/details>\n<details><summary>ขั้น 7 · บำรุงผลและคุณภาพเนื้อ · ดอกบาน +60 ถึง +95<\/summary>\n<ul><li>+45, +60, +80: แคลเซียม-โบรอน (ครั้งสุดท้ายที่ +80)<\/li><li>+63: ปุ๋ย K สูง (13-13-21 หรือ 0-0-60)<\/li><li>+84: ลดน้ำลงทีละน้อย งด N<\/li><li>ตลอดช่วง: ให้น้ำสม่ำเสมอ อย่าปล่อยแล้งจัดแล้วให้น้ำทีเดียว<\/li><\/ul>\n<p class=\"muted\">Ca ยึดผนังเซลล์ B ช่วยลำเลียง Ca ขาดแล้วไส้ซึม เต่าเผา K พาน้ำตาลเข้าเนื้อ เนื้อแห้งเพิ่ม N ช่วงท้ายทำให้เนื้อแฉะ<\/p><\/details>\n<details><summary>ขั้น 8 · ก่อนเก็บเกี่ยว และตัด · ดอกบาน +95 ถึง +120<\/summary>\n<ul><li>วันตัด −25: กันผลเน่า เมทาแลกซิล 25% WP 30–50 ก./น้ำ 20 ล. (4)<\/li><li>วันตัด −16: ฟอสอีทิล-อะลูมิเนียม 80% WP 30–50 ก./น้ำ 20 ล. (P07) แล้ว <b>หยุดพ่น<\/b> (ต้องเว้น ≥15 วัน)<\/li><li>วันตัด −7: สุ่มตัด 1 ผลตรวจเนื้อแห้ง หมอนทองต้อง ≥32% (มกษ. 3-2556)<\/li><li>ตัด: หมอนทอง 110–125 วันหลังดอกบาน ผูกป้ายสีตามรุ่น ไม่ให้ผลสัมผัสดิน<\/li><\/ul>\n<p class=\"muted\">เก็บรุ่นสุดท้ายเสร็จ → กลับไปขั้น 1 ของปีถัดไป<\/p><\/details>\n\n<h2 class=\"g-h\">อ้างอิงใช้ทั้งปี<\/h2>\n<details><summary>เทคนิคการฉีดพ่น<\/summary>\n<p><b>ลำดับผสมลงถัง (หลัก WALES)<\/b> ห้องผสมยาในแอปเรียงให้อัตโนมัติ<\/p>\n<ol><li>น้ำสะอาดอย่างน้อยครึ่งถัง เริ่มกวน<\/li><li>ถุงละลายน้ำ → เม็ด (WG/WDG) → ผง (WP)<\/li><li>กวนจนผงกระจายหมด<\/li><li>น้ำข้น (SC/SE)<\/li><li>น้ำมัน (EC)<\/li><li>น้ำใส (SL)<\/li><li>ปุ๋ยทางใบ แล้วสารจับใบท้ายสุด เติมน้ำจนเต็ม<\/li><\/ol>\n<p>ใส่ทีละตัว รอ 3–5 นาทีให้เข้ากันก่อนใส่ตัวถัดไป กวนพอให้ผิวน้ำเคลื่อน ไม่ใช่จนเดือดเป็นฟอง สารคู่ใหม่ให้ลองผสมในขวดใสก่อน ตั้งทิ้ง 15 นาที ถ้าตกตะกอนหรือแยกชั้นห้ามผสมรวม<\/p>\n<p><b>น้ำยาต่อต้น<\/b> เติมน้ำเปล่ารู้ปริมาตร พ่นต้นขนาดกลาง 1 ต้นจนเปียกทั่วบนและใต้ใบ พอใบมีหยดเกาะแต่ไม่ไหลโชก วัดน้ำที่ใช้ = ลิตร/ต้น แล้ว × จำนวนต้น = น้ำยาต่อรอบ จดแยกตามขนาดต้น<\/p>\n<p><b>เวลา<\/b> 06–10 น. หรือ 16–18 น. ลมสงบ ≤33°C ไม่มีฝน 4 ชม. หลังพ่น (หน้าอากาศหาช่วงให้) แมลงใต้ใบต้องเงยหัวฉีดให้ถึงใต้ใบ<\/p>\n<p><b>ความปลอดภัย<\/b> ถุงมือไนไตรล์ หน้ากากกรองสาร แว่น เสื้อแขนยาว รองเท้าบูท ไม่กินดื่มสูบระหว่างทำ ล้างถังและสายทุกครั้ง เว้นระยะเข้าแปลงและก่อนตัดตามฉลาก จดทุกครั้งในแอปเพื่อใช้เป็นหลักฐาน GAP<\/p>\n<\/details>\n<details><summary>การให้น้ำแต่ละระยะ<\/summary>\n<table class=\"fl-table\"><thead><tr><th>ระยะ<\/th><th>ขั้น<\/th><th>% ของการระเหย<\/th><\/tr><\/thead><tbody>\n<tr><td>สร้างกิ่งและทรงพุ่ม<\/td><td>1–2, ต้นเล็ก<\/td><td>60%<\/td><\/tr>\n<tr><td>ชักนำดอก<\/td><td>4<\/td><td>งดน้ำ 10–14 วัน (ไม่ทำสาร: นานกว่า)<\/td><\/tr>\n<tr><td>ตาดอกถึงก่อนบาน<\/td><td>5<\/td><td>75%<\/td><\/tr>\n<tr><td>1 สัปดาห์ก่อนบาน–2 สัปดาห์หลังบาน<\/td><td>5–6<\/td><td>20–25%<\/td><\/tr>\n<tr><td>ผลอ่อนถึง 4 สัปดาห์<\/td><td>6<\/td><td>60% → 70%<\/td><\/tr>\n<tr><td>ผลโต 10 สัปดาห์ขึ้นไป<\/td><td>7<\/td><td>85%<\/td><\/tr>\n<tr><td>เริ่มแก่<\/td><td>8<\/td><td>60%<\/td><\/tr><\/tbody><\/table>\n<p><b>ลิตร/ต้น/วัน<\/b> = (% ÷ 100) × การระเหย (มม.) × 3.14 × รัศมีทรงพุ่ม² เช่น ทรงพุ่ม 6 ม. ช่วงผลโต วันระเหย 4.5 มม. ≈ 108 ลิตร หักฝนที่ตก หน้า \"อากาศ\" คำนวณให้ตามระยะต้น<\/p>\n<p>หมอนทองใช้น้ำราว 30–270 ลิตร/วัน (ม.บูรพา) ช่วงแล้งร้อนจัด กรมวิชาการเกษตรแนะนำอย่างน้อย 200 ลิตร/ต้น/วัน ช่วง 06–08 น. หรือ 15–17 น. ตรวจง่าย ๆ: กำดินใต้ทรงพุ่ม ปั้นได้แต่แตกง่าย = พอดี<\/p>\n<\/details>\n<details><summary>โรคแมลงและกลุ่มสาร<\/summary>\n<p>หมุนตามกลุ่มกลไก (FRAC/IRAC บนฉลาก) กลุ่มเดียวกันไม่ใช้ติดกันเกิน 2 ครั้ง<\/p>\n<table class=\"fl-table\"><thead><tr><th>ปัญหา<\/th><th>สาร (กลุ่ม)<\/th><th>หมายเหตุ<\/th><\/tr><\/thead><tbody>\n<tr><td>รากเน่าโคนเน่า<\/td><td>เมทาแลกซิล (4), ฟอสโฟเนต/ฟอสอีทิล-อะลูมิเนียม (P07), ไตรโคเดอร์มา<\/td><td>เมทาแลกซิลดื้อยาเร็ว ใช้ตอนระบาด<\/td><\/tr>\n<tr><td>ผลเน่า<\/td><td>เมทาแลกซิล 25% หรือฟอสอีทิล-อะลูมิเนียม 80% 30–50 ก./น้ำ 20 ล.<\/td><td>หยุดพ่น ≥15 วันก่อนตัด<\/td><\/tr>\n<tr><td>ราสีชมพู<\/td><td>ทองแดง (M01)<\/td><td>ตัดแต่งให้โปร่งคือการป้องกันหลัก<\/td><\/tr>\n<tr><td>แอนแทรคโนส/ใบจุด<\/td><td>แมนโคเซบ (M03) สลับ strobilurin (11)<\/td><td><\/td><\/tr>\n<tr><td>เพลี้ยไก่แจ้<\/td><td>4A สลับ 3A<\/td><td>พ่นตอนใบเพิ่งแทง<\/td><\/tr>\n<tr><td>เพลี้ยไฟ<\/td><td>spinosyn (5) สลับกลุ่มอื่น<\/td><td>ทำให้ผิวกร้าน หนามแดง<\/td><\/tr>\n<tr><td>หนอนเจาะผล<\/td><td>diamide (28)<\/td><td>ดูรอยขี้หนอนระหว่างผลชิดกัน<\/td><\/tr>\n<tr><td>ไรแดง<\/td><td>อะบาเมกติน (6) หรือกำมะถันผง<\/td><td>หน้าแล้ง<\/td><\/tr><\/tbody><\/table>\n<p>ต้นเป็นโคนเน่า: ถากส่วนเน่าออกบาง ๆ ทาสารดูดซึม หรืออัดฉีดฟอสฟอรัสแอซิดเข้าลำต้น ล้างเครื่องมือก่อนใช้กับต้นอื่น<\/p>\n<\/details>\n<details><summary>ปุ๋ยทั้งปี: คำนวณจากสิ่งที่ผลดึงออกไป<\/summary>\n<p>กรมวิชาการเกษตรใช้ 1.3-1-1.2 กก. N-P₂O₅-K₂O/ต้นเตรียมต้น และ 1-0.5-2 กก./ต้นหลังติดผล (เป็นเนื้อธาตุ ไม่ใช่น้ำหนักปุ๋ย)<\/p>\n<p><b>แปลงเป็นปุ๋ย:<\/b> น้ำหนักปุ๋ย = ธาตุที่ต้องการ × 100 ÷ เลขสูตร เช่น K₂O 2 กก. จาก 0-0-60 = 3.3 กก./ต้น/ปี แบ่ง 3–4 ครั้ง ต้นเล็กหรือผลน้อยลดตามขนาดทรงพุ่ม<\/p>\n<\/details>\n<details><summary>รับมือสภาพอากาศ<\/summary>\n<table class=\"fl-table\"><thead><tr><th>เหตุการณ์<\/th><th>ทำทันที<\/th><th>ป้องกันปีหน้า<\/th><\/tr><\/thead><tbody>\n<tr><td>น้ำท่วมขัง<\/td><td>สูบน้ำออกเร็วที่สุด ห้ามเหยียบดินโคนต้น/ใช้เครื่องจักรหนัก พรวนเบา ๆ ไตรโคเดอร์มา + ฟอสโฟเนต งดปุ๋ยทางดินจนเห็นรากใหม่ ใช้ปุ๋ยทางใบแทน<\/td><td>ยกเนิน/ยกร่อง ร่องระบาย เครื่องสูบสำรอง<\/td><\/tr>\n<tr><td>ฝนช่วงทำดอก<\/td><td>พ่น 0-52-34 ซ้ำ เปิดร่องระบาย ถ้าใบอ่อนออกแล้ว รอเพสลาดแล้วทำรอบใหม่<\/td><td>คลุมพลาสติกใต้ทรงพุ่มช่วงทำดอก<\/td><\/tr>\n<tr><td>ฝนหนักหลังแล้ง ช่วงผลใกล้แก่<\/td><td>เปิดร่อง งดน้ำ พ่นแคลเซียม-โบรอน กันผลเน่า<\/td><td>ให้น้ำสม่ำเสมอตลอดช่วงผล<\/td><\/tr>\n<tr><td>แล้ง/ร้อนจัด<\/td><td>ให้น้ำเช้า-เย็น คลุมโคน พ่นน้ำฝอยช่วงดอกบาน<\/td><td>บ่อน้ำพอ ไม้บังลม-แดด<\/td><\/tr>\n<tr><td>หนาวจัดช่วงดอกบาน<\/td><td>เลือกผสมเกสรคืนที่อุ่นกว่า<\/td><td>ดูพยากรณ์ก่อนกำหนดวันทำดอก<\/td><\/tr>\n<tr><td>ลมแรง/พายุ<\/td><td>โยงกิ่ง ค้ำกิ่ง หลังพายุตัดแต่งแผล ทาสารกันรา<\/td><td>คุมทรงสูง ≤6–7 ม. ไม้บังลม<\/td><\/tr><\/tbody><\/table>\n<p class=\"muted\">หน้า \"อากาศ\" เตือนเรื่องเหล่านี้ล่วงหน้าตามระยะต้นให้อัตโนมัติ<\/p>\n<\/details>\n<details><summary>จดบันทึกเพื่อทำซ้ำ<\/summary>\n<ul><li>ต่อต้น: วันแตกใบแต่ละชุด วันพ่น PBZ (ppm) วันเห็นตาดอก วันดอกบาน จำนวนผลที่เก็บ น้ำหนัก % เกรด A ปัญหาที่พบ<\/li>\n<li>ต่อสวน: ฝนรายวัน อุณหภูมิต่ำสุดช่วงดอกบาน ปุ๋ยและสารทุกครั้ง (กลุ่ม FRAC/IRAC อัตรา)<\/li>\n<li>ต่อปี: ตรวจใบปีละครั้ง (ใบอายุ 4–7 เดือนก่อนทำดอก) ตรวจดินทุก 2–3 ปี<\/li><\/ul>\n<table class=\"fl-table\"><thead><tr><th>ธาตุในใบหมอนทอง<\/th><th>ค่าอ้างอิง<\/th><\/tr><\/thead><tbody>\n<tr><td>N<\/td><td>2.32%<\/td><\/tr><tr><td>P<\/td><td>0.21%<\/td><\/tr><tr><td>K<\/td><td>1.98%<\/td><\/tr><tr><td>Ca<\/td><td>1.71%<\/td><\/tr><tr><td>Mg<\/td><td>0.30%<\/td><\/tr><tr><td>B<\/td><td>35.6 มก./กก.<\/td><\/tr><\/tbody><\/table>\n<p>ทุกสิ้นฤดู เทียบต้นที่ได้เกรด A มากที่สุดกับต้นที่แย่ที่สุด ดูว่าต่างกันที่ขั้นไหน แล้วเปลี่ยนทีละ 1 ตัวแปรในปีถัดไป<\/p>\n<\/details>\n<details><summary>หลักคิดชีวเคมี 5 ข้อ (ทำไมถึงทำตามลำดับนี้)<\/summary>\n<ul>\n<li><b>C/N ratio<\/b> N สูง ต้นแตกใบ · C สูงกว่า N ตาพร้อมเป็นดอก → ขั้น 3 ลด N เพิ่ม P, K<\/li>\n<li><b>GA กับ PBZ<\/b> GA สั่งแตกใบ PBZ ยับยั้งการสร้าง GA → ขั้น 3<\/li>\n<li><b>ABA และความเครียดน้ำ<\/b> ดินแห้งสั้น ๆ ระงับการแตกใบ → ขั้น 4<\/li>\n<li><b>แหล่งสร้าง-แหล่งใช้<\/b> ใบอ่อนแย่งอาหารจากผล → ขั้น 6 คุมใบอ่อน<\/li>\n<li><b>แคลเซียม + โบรอน<\/b> ผนังเซลล์และการลำเลียง → ขั้น 5–7<\/li>\n<\/ul><\/details>\n<p class=\"muted\" style=\"font-size:13px\">อ้างอิงหลัก: กรมวิชาการเกษตร (การปลูกและการผลิตทุเรียน, ธาตุอาหารหมอนทอง, การใช้ปุ๋ย, โรคทุเรียน), ศูนย์วิจัยพืชสวนจันทบุรี (PBZ, เกสรจันทบุรี 3), JARQ 2024, มกษ. 3-2556, ม.บูรพา (การใช้น้ำหมอนทอง), หลัก WALES (Syngenta, Virginia Tech) · ตัวเลขปุ๋ยต้นเล็ก ความสูงเนิน อัตรา PBZ ปีแรก และสารบางกลุ่มเป็นแนวปฏิบัติทั่วไปของชาวสวน ให้เทียบกับผลตรวจดินและฉลากจริง<\/p>\n<\/div>";
const MG_GUIDE_HTML="<div class=\"guide\">\n<p class=\"lead\">คู่มือมังคุดต้นใหญ่ (อายุราว 50 ปี) ภาคตะวันออก ดูแลร่วมกับสวนทุเรียน เรียงตามเวลาของปี: หลังเก็บเกี่ยว → สร้างใบ → สะสมอาหาร → งดน้ำเปิดตาดอก → ดอกและผล → เก็บเกี่ยว อัตราสารให้ยึดฉลากจริง และดูสภาพต้นเป็นหลัก ไม่ใช่วันในปฏิทิน<\/p>\n<div class=\"g-flow\"><span>1 ฟื้นต้น มิ.ย.–ก.ค.<\/span><span>2 ใบอ่อน ก.ค.–ก.ย.<\/span><span>3 สะสมอาหาร ต.ค.<\/span><span>4 งดน้ำ พ.ย.–ธ.ค.<\/span><span>5 ดอก ม.ค.–ก.พ.<\/span><span>6 ผลโต ก.พ.–เม.ย.<\/span><span>7 เก็บ พ.ค.–มิ.ย.<\/span><\/div>\n\n<h2 class=\"g-h\">ต้นมังคุดอายุมาก ต่างจากทุเรียนอย่างไร<\/h2>\n<ul class=\"g-p\">\n<li>ไม่ต้องทำสาร PBZ ใช้ความแล้งปลายปีเปิดตาดอกเป็นหลัก<\/li>\n<li>ใบต้องแก่จัดก่อนเข้าแล้ง ถ้าใบชุดสุดท้ายยังอ่อนตอนหมดฝน ปีนั้นดอกจะน้อย<\/li>\n<li>ศัตรูสำคัญคือ <b>เพลี้ยไฟ<\/b> ช่วงดอกถึงผลอ่อน ทำผิวลาย ขายเกรดส่งออกไม่ได้<\/li>\n<li>ปัญหาคุณภาพหลักคือ <b>เนื้อแก้ว ยางไหล<\/b> มาจากน้ำขึ้นลงแรง ต้องคุมน้ำให้สม่ำเสมอช่วงผลโต<\/li>\n<li>เกณฑ์ส่งออก: ผลไม่ต่ำกว่า 70 กรัม ผิวมัน ไม่มีตำหนิเด่น ไม่มีเนื้อแก้วยางไหล<\/li>\n<\/ul>\n\n<h2 class=\"g-h\">ช่วงที่ 1 · ฟื้นต้นหลังเก็บเกี่ยว (มิ.ย.–ก.ค.)<\/h2>\n<details><summary>ตัดแต่งกิ่ง คุมทรงต้นสูง<\/summary>\n<ul>\n<li>ตัดกิ่งแห้ง กิ่งเป็นโรค กิ่งกระโดงกลางพุ่ม กิ่งที่ถูกบังแสง ทาแผลกิ่งใหญ่ด้วยสารทองแดง<\/li>\n<li>ต้นอายุ 50 ปีมักสูงเกิน ฉีดยาและเก็บผลยาก กรมวิชาการเกษตรทดลองคุมทรงพุ่มเป็นครึ่งวงกลมสูง 3–5 ม. ให้ <b>ลดความสูงทีละน้อยปีละรอบ 2–3 ปี<\/b> ไม่ตัดหนักทีเดียว เพราะต้นจะแตกกิ่งกระโดงมากและปีนั้นแทบไม่มีดอก<\/li>\n<li>เปิดกลางพุ่มให้แดดส่องถึงกิ่งด้านใน กิ่งที่ได้แดดคือกิ่งที่ออกดอก<\/li>\n<\/ul><\/details>\n<details><summary>ปุ๋ยฟื้นต้น<\/summary>\n<ul>\n<li>ปุ๋ยอินทรีย์ 20–30 กก./ต้น<\/li>\n<li>15-15-15 อัตรา (เส้นผ่านศูนย์กลางทรงพุ่ม ÷ 3) กก./ต้น เช่น ทรงพุ่ม 9 ม. = 3 กก. โรยรอบชายพุ่ม ไม่ใช่โคนต้น<\/li>\n<li>ต้นโทรมจากติดผลมาก: เพิ่ม N เช่น ผสม 46-0-0 เล็กน้อย และพ่นปุ๋ยทางใบสูตรครบธาตุ<\/li>\n<li>ถ้าใส่ปุ๋ยพร้อมทุเรียน ให้จดในแอปว่าเป็นงานของ \"ทุกต้น\" แอปจะแบ่งค่าใช้จ่ายให้เอง<\/li>\n<\/ul><\/details>\n\n<h2 class=\"g-h\">ช่วงที่ 2 · สร้างใบ (ก.ค.–ก.ย.)<\/h2>\n<details><summary>ดูแลใบอ่อน<\/summary>\n<ul>\n<li>เป้าหมาย: แตกใบพร้อมกันทั้งต้น 1–2 ชุด และใบชุดสุดท้ายแก่จัดก่อนหมดฝน<\/li>\n<li>ใบอ่อนแทง: ตรวจหนอนกินใบอ่อน เพลี้ยไฟ ไรแดง พ่นเมื่อพบจริง สลับกลุ่มสาร<\/li>\n<li>ช่วงฝนชุก: ระวังโรคใบจุด แอนแทรคโนส พ่นสารกันราเมื่อใบอ่อนเป็นจุด<\/li>\n<li>ใบช้าไม่แก่ตอนใกล้หมดฝน: พ่นปุ๋ยทางใบสูตรครบธาตุ 2–3 ครั้งให้ใบแก่เต็มที่ และยังให้น้ำเลี้ยงต้นต่อ<\/li>\n<\/ul><\/details>\n\n<h2 class=\"g-h\">ช่วงที่ 3 · สะสมอาหาร (ต.ค.)<\/h2>\n<details><summary>เตรียมต้นก่อนออกดอก<\/summary>\n<ul>\n<li>ภาคตะวันออก: 8-24-24 หรือ 9-24-24 อัตรา 2–3 กก./ต้น (ต้นใหญ่ให้ค่าบน)<\/li>\n<li>งด N ทุกชนิดตั้งแต่นี้จนดอกบาน<\/li>\n<li>ใบอ่อนยังแตก: พ่น 0-52-34 กดใบอ่อนเหมือนทุเรียน<\/li>\n<li>ตัดหญ้าใต้ทรงพุ่ม เตรียมให้ดินแห้งเร็วเมื่อหมดฝน<\/li>\n<\/ul><\/details>\n\n<h2 class=\"g-h\">ช่วงที่ 4 · งดน้ำเปิดตาดอก (พ.ย.–ธ.ค.)<\/h2>\n<details><summary>ลำดับงาน<\/summary>\n<ol>\n<li>ฝนหยุด → งดน้ำราว 3–4 สัปดาห์ จนใบห่อตอนบ่ายหลายวันติดกัน<\/li>\n<li>เห็นตาดอกเป็นตุ่มที่ปลายกิ่ง → ให้น้ำกลับทีละน้อยก่อน แล้วค่อยเพิ่ม ห้ามให้เต็มทันที<\/li>\n<li>ฝนตกกลางช่วงงดน้ำ: เปิดร่องระบาย พ่น 0-52-34 ซ้ำ รอแล้งรอบถัดไป<\/li>\n<\/ol>\n<p class=\"muted\">ช่วงงดน้ำของมังคุดตรงกับทุเรียน ถ้าระบบน้ำใช้โซนเดียวกันทำพร้อมกันได้ แต่เมื่อทุเรียนติดผลแล้ว (ม.ค.–มี.ค.) ต้องให้น้ำทุเรียนเพิ่ม ส่วนมังคุดยังต้องการน้ำน้อยช่วงดอกบาน ควรแยกวาล์วมังคุดตอนวางท่อใหม่<\/p><\/details>\n\n<h2 class=\"g-h\">ช่วงที่ 5 · ดอกถึงผลอ่อน (ม.ค.–ก.พ.)<\/h2>\n<details><summary>ป้องกันเพลี้ยไฟ ตั้งแต่ดอกถึงผลอายุ 4 สัปดาห์<\/summary>\n<ul>\n<li>ช่วงที่เพลี้ยไฟทำลายผิวผลแรงที่สุด ผิวจะเป็นขี้กลาก ลาย ตกเกรด<\/li>\n<li>สำรวจทุก 5–7 วัน เคาะช่อดอกหรือยอดอ่อนบนกระดาษขาว พบตัวเฉลี่ยมากให้พ่น<\/li>\n<li>สลับกลุ่มสารทุกครั้ง (เช่น กลุ่ม 5 spinosyn ↔ 4A ↔ 13) ไม่ใช้กลุ่มเดียวกันติดกันเกิน 2 ครั้ง<\/li>\n<li>ไรแดงระบาดช่วงแล้งร้อน ดูใต้ใบ ใบซีดเป็นจุด ใช้สารกำจัดไรเฉพาะเมื่อพบ<\/li>\n<li>ช่วงทุเรียนพ่นกันเพลี้ยไฟเหมือนกัน พ่นรวมกันได้ ถ้าฉลากระบุใช้กับมังคุดด้วย<\/li>\n<\/ul><\/details>\n<details><summary>น้ำและปุ๋ยช่วงติดผล<\/summary>\n<ul>\n<li>หลังติดผล: ปุ๋ยสัดส่วน 3:1:4 (เช่น 13-13-21 หรือตามค่าวิเคราะห์ดิน) อัตรา (ทรงพุ่ม ÷ 3) กก./ต้น<\/li>\n<li>พ่นปุ๋ยทางใบสัดส่วน 4:1:6 (เช่น 15-5-20) 100 กรัม/น้ำ 20 ลิตร<\/li>\n<li>แคลเซียม-โบรอนทางใบช่วงผลอ่อน ช่วยเปลือกแข็งแรง<\/li>\n<\/ul><\/details>\n\n<h2 class=\"g-h\">ช่วงที่ 6 · ผลโต (ก.พ.–เม.ย.)<\/h2>\n<details open><summary>คุมน้ำ กันเนื้อแก้วยางไหล<\/summary>\n<table class=\"fl-table\"><thead><tr><th>อายุผล<\/th><th>ให้น้ำ (% ของปกติ)<\/th><\/tr><\/thead><tbody>\n<tr><td>ติดผล–5 สัปดาห์<\/td><td>80% ทุก 3 วัน<\/td><\/tr>\n<tr><td>5–10 สัปดาห์<\/td><td>90%<\/td><\/tr>\n<tr><td>10–12 สัปดาห์ถึงเก็บ<\/td><td>80%<\/td><\/tr><\/tbody><\/table>\n<ul>\n<li>อย่าปล่อยแล้งนานแล้วเจอฝนหนัก เนื้อแก้วเป็นหนักช่วงที่ฝนทิ้งช่วงนานสลับฝนตกมากเกิน 20 มม./วัน ถ้าหน้าอากาศเตือนฝนหนักหลังแล้ง ให้น้ำสม่ำเสมอก่อนฝนมา และเปิดร่องระบาย<\/li>\n<li>ยางไหลมาจากน้ำขึ้นลงแรงและผลเป็นแผล ระวังกิ่งเสียดสี และผลตกกระแทก<\/li>\n<li>ผลอายุ 2 เดือนขึ้นไป ระวังเพลี้ยแป้งตามขั้วผล ใกล้สุกระวังผีเสื้อมวนหวาน (บางปี)<\/li>\n<\/ul><\/details>\n\n<h2 class=\"g-h\">ช่วงที่ 7 · เก็บเกี่ยว (พ.ค.–มิ.ย.)<\/h2>\n<details><summary>ระยะเก็บและวิธีเก็บ<\/summary>\n<ul>\n<li>เก็บระยะสายเลือด (ผิวเริ่มมีจุดชมพู) ถึงผิวแดง สำหรับส่งออกหรือส่งไกล ผลจะสุกต่อเองใน 2–3 วัน<\/li>\n<li>ผลทยอยแก่ เดินเก็บทุก 3–5 วัน ราว 3 สัปดาห์ต่อรุ่น<\/li>\n<li>ใช้ตะกร้อสอยหรือเก็บมือ ห้ามปล่อยผลตกพื้น ผลที่กระแทกจะเกิดยางไหลในผล<\/li>\n<li>คัดเกรดในที่ร่ม: ผิวมัน (ส่งออก) / ผิวลาย / ตกเกรด จดแยกเกรดตอนขายในแอป<\/li>\n<li>หยุดพ่นสารเคมีตามระยะเว้นบนฉลากก่อนเก็บ (แผนเก็บมังคุดในหน้า ทำดอก/ติดผล เตือนให้)<\/li>\n<\/ul>\n<p class=\"muted\">เก็บรุ่นสุดท้ายเสร็จ → ตัดแต่งกิ่ง ใส่ปุ๋ยฟื้นต้น เริ่มช่วงที่ 1 ของปีถัดไป<\/p><\/details>\n\n<h2 class=\"g-h\">อ้างอิงใช้ทั้งปี<\/h2>\n<details><summary>หลังน้ำท่วม<\/summary>\n<ul>\n<li>น้ำลดแล้วห้ามเหยียบหรือไถดินใต้ทรงพุ่มจนดินหมาด รากกำลังขาดอากาศ<\/li>\n<li>ขุดร่องระบายน้ำขังโคนต้น หว่านไตรโคเดอร์มา ราดหรือพ่นฟอสโฟเนตกันรากเน่า<\/li>\n<li>ยังไม่ใส่ปุ๋ยเคมีทางดินจนต้นแตกใบใหม่ ใช้ปุ๋ยทางใบสูตรครบธาตุแทน<\/li>\n<li>ตัดกิ่งที่ใบร่วงและแห้งตายออก ลดภาระต้น<\/li>\n<\/ul><\/details>\n<details><summary>ตรวจดินและใบ<\/summary>\n<ul>\n<li>ต้นอายุมาก ดินมักเป็นกรดและขาดธาตุรอง เก็บดินใต้ทรงพุ่มและใบส่งวิเคราะห์ทุก 2–3 ปี แล้วใส่ปุ๋ยตามผล<\/li>\n<li>ถ้ายังไม่ได้ตรวจ ใช้อัตราในคู่มือนี้ไปก่อน แล้วจดผลผลิตแต่ละปีในแอปเพื่อดูว่าได้ผลไหม<\/li>\n<\/ul><\/details>\n<p class=\"muted\" style=\"font-size:13px\">อ้างอิง: กรมวิชาการเกษตร (การผลิตมังคุด, การจัดการศัตรูมังคุดเพื่อการส่งออก, งานวิจัยการจัดการทรงพุ่มและเนื้อแก้วยางไหล) และสำนักงานเกษตรจังหวัดจันทบุรี อัตราเป็นแนวทางทั่วไป ให้ปรับตามสภาพต้นและค่าวิเคราะห์ดิน<\/p>\n<\/div>";
function guideHTML(){const gc=ui.guideCrop||'ทุเรียน',top=`<div class="seg" style="margin-bottom:10px">${['ทุเรียน','มังคุด'].map(c=>`<button data-act="gcrop" data-v="${c}" aria-pressed="${gc===c}">คู่มือ${c}</button>`).join('')}</div>`;
  if(gc==='มังคุด')return top+MG_GUIDE_HTML;
  const m=ui.guideMode||planMeta().mode||'pbz';return top+`<div class="seg g-mode" style="margin-bottom:14px">${[['pbz','แบบทำสาร (PBZ)'],['nat','แบบไม่ทำสาร']].map(([k,t])=>`<button data-act="gmode" data-v="${k}" aria-pressed="${m===k}">${t}</button>`).join('')}</div>`+GUIDE_HTML.replace('<div class="guide">','<div class="guide m-'+m+'">')}


/* ---------- mix banner: step-by-step reminder after saving a mix ---------- */
const MBKEY='durian-mixbanner-v1';
function loadMB(){if(ui.mb===undefined){try{ui.mb=JSON.parse(localStorage.getItem(MBKEY)||'null')}catch(e){ui.mb=null}}}
function saveMB(){try{if(ui.mb)localStorage.setItem(MBKEY,JSON.stringify(ui.mb));else localStorage.removeItem(MBKEY)}catch(e){}}
function startMixBanner(){const r=mixCalc(ui.mix);if(!r.rows.length)return;
  const steps=[{t:'เติมน้ำประมาณครึ่งถัง',s:'เปิดเครื่องกวนหรือคนตลอดการผสม',q:nf.format(r1(r.tank/2))+' ลิตร',w:1}]
   .concat(r.order.map(x=>({t:x.c.name,f:x.f.sh,s:x.f.tip,q:x.amt?fmtAmt(x.per,x.unit):'ยังไม่ใส่อัตรา',all:r.tanks>1&&x.amt?fmtAmt(x.all,x.unit):''})))
   .concat([{t:'เติมน้ำจนครบถัง',s:'กวนต่ออีกสักครู่ ฉีดให้หมดภายในวัน',q:nf.format(r.tank)+' ลิตร',w:1}]);
  ui.mb={name:(ui.mix.name||'สูตรผสม').trim(),tank:r.tank,tanks:r.tanks,cur:1,steps,done:[],min:false,warns:r.warns.filter(w=>w.lv==='bad').map(w=>(w.a?w.a+' + '+w.b+': ':'')+w.msg),phi:r.phi,at:Date.now()};
  saveMB();window.scrollTo(0,0)}
function mixBannerHTML(){loadMB();const b=ui.mb;if(!b)return '';const n=b.steps.length,dn=b.done.length,next=b.steps.findIndex((_,i)=>!b.done.includes(i));
  const head=`<div class="mb-h"><div><b>กำลังผสม: ${esc(b.name)}</b><span>ถังละ ${nf.format(b.tank)} ลิตร${b.tanks>1?` · ถังที่ ${b.cur}/${b.tanks}`:''} · เสร็จ ${dn}/${n} ขั้น</span></div><button class="link" data-act="mbmin">${b.min?'ขยาย':'ย่อ'}</button></div>`;
  if(b.min)return `<div class="mixban min">${head}${next>=0?`<div class="mb-next">ต่อไป: <b>${esc(b.steps[next].t)}</b> ${esc(b.steps[next].q)}</div>`:'<div class="mb-next">ครบทุกขั้นแล้ว</div>'}</div>`;

   <div class="row" style="margin-top:10px">${fin&&b.cur<b.tanks?`<button class="btn pri" data-act="mbnext">เริ่มถังที่ ${b.cur+1}</button>`:''}${fin&&b.cur>=b.tanks?`<button class="btn pri" data-act="mbclose">ผสมเสร็จแล้ว ปิดแบนเนอร์</button>`:''}${!fin?`<button class="btn" data-act="mbreset">เริ่มถังนี้ใหม่</button>`:''}<button class="link" data-act="mbclose">ปิด</button></div></div>`}
function mbAct(a,el){loadMB();const b=ui.mb;if(!b&&a!=='mbstart')return false;

  if(a==='mbtick'){const i=+el.dataset.i;b.done=b.done.includes(i)?b.done.filter(x=>x!==i):b.done.concat(i);saveMB();render();return true}
  if(a==='mbmin'){b.min=!b.min;saveMB();render();return true}
  if(a==='mbnext'){b.cur++;b.done=[];saveMB();render();window.scrollTo(0,0);return true}

function orchardStage(st){const cnt={};trees().filter(t=>!isMg(t)).forEach(t=>{const s=st[t.id].stage;cnt[s]=(cnt[s]||0)+1});const e=Object.entries(cnt).sort((a,b)=>b[1]-a[1]);return {main:e[0]?e[0][0]:null,cnt}}
function pestRisk(st){const mi=+today().slice(5,7)-1,os=orchardStage(st),stages=Object.keys(os.cnt);
  const hasFlowerData=stages.some(s=>!['rest','young'].includes(s));
  const ages=trees().filter(t=>!isMg(t)).map(t=>st[t.id]).filter(s=>s.stage==='fruit'&&s.age!=null).map(s=>s.age);
  const wx=planMeta().lat!=null?wxAnalyze(st):null;
  const rain7=wx?wx.days.slice(0,7).filter(x=>x.r>=5).length:null,dry=wx?wx.dry:null,rhLow=wx?Math.min(...wx.days.slice(0,5).map(x=>x.rh??100)):null;
  return PESTS.map(p=>{let s=p.m[mi];const why=[];
    if(p.st&&p.st.some(x=>stages.includes(x))){s+=1;why.push('ต้นอยู่ระยะ'+p.st.filter(x=>stages.includes(x)).map(x=>ST[x].t).join('/'))}
    if(p.fruit!=null&&hasFlowerData){const ok=ages.some(a=>a>=p.fruit);if(ok){s=Math.max(s,2)+(p.fruit?1:0);why.push(p.fruit?'มีผลอายุ ≥'+Math.round(p.fruit/7)+' สัปดาห์':'มีผลอ่อนอยู่')}else s=Math.min(s,1)}
    if(wx){if(p.wet&&rain7>=3){s+=1;why.push('ฝนตก '+rain7+' วันใน 7 วันข้างหน้า')}
      if(p.dry&&rain7>=3)s-=1;
      if(p.dry&&dry>=10&&rain7<2){s+=1;why.push('แล้งมา '+dry+' วัน')}
      if(p.k==='mite'&&rhLow<50){s+=1;why.push('อากาศแห้ง ความชื้นต่ำ')}}
    s=Math.max(0,Math.min(3,s));return {...p,s,why,base:p.m[mi]}}).sort((a,b)=>b.s-a.s||b.base-a.base)}

function bannedOf(txt){const s=String(txt||'').toLowerCase().replace(/\s+/g,'');if(!s)return null;
  for(const b of BANNED)if(b[1].some(k=>s.includes(k.replace(/\s+/g,''))))return {lv:'bad',name:b[0],why:'ห้ามใช้ในไทยตั้งแต่ พ.ศ. '+b[2]};
  for(const b of RESTRICT)if(b[1].some(k=>s.includes(k)))return {lv:'warn',name:b[0],why:b[2]};return null}
const chemBan=c=>c?bannedOf((c.name||'')+' '+(c.aiName||'')):null;
const NEEDPHI=['fung','ins','phos','cu','s'];
const chemNoPhi=c=>c&&!(+c.phi)&&!['FERT','ADJ'].includes(c.form)&&(c.tags||[]).some(t=>NEEDPHI.includes(t))&&!(c.tags||[]).includes('bio');
function safetyIssues(){const out=[];
  chemList().forEach(c=>{const b=chemBan(c);if(b)out.push({lv:b.lv,t:`${c.name}: ${b.name}`,s:b.why,go:'chems'});else if(chemNoPhi(c))out.push({lv:'warn',t:`${c.name}: ยังไม่ใส่ระยะเว้นก่อนตัด`,s:'ดูบนฉลาก แล้วใส่ในคลังสาร แอปจะเตือนถ้าวันตัดอยู่ในระยะเว้นยา',go:'chems'})});
  const y0=addDays(today(),-365),seen=new Set(out.map(o=>o.t));
  list('works').filter(w=>w.date>=y0).forEach(w=>{const b=bannedOf(w.product);if(b&&b.lv==='bad'){const t=`${w.product}: ${b.name}`;if(!seen.has(t)){seen.add(t);out.push({lv:'bad',t,s:'มีในบันทึกงานเมื่อ '+fd(w.date)+' · '+b.why+' ผลผลิตอาจถูกตีกลับ',go:'works'})}}});
  return out}

  const conf=sc>=7&&m>=2?'สูง':sc>=4?'กลาง':'ต่ำ';return {r,sc,m,conf}}).filter(Boolean).sort((a,b)=>b.sc-a.sc).slice(0,4)}

const SF=[['pH','pH',''],['om','อินทรียวัตถุ','%'],['p','ฟอสฟอรัส (P)','ppm'],['k','โพแทสเซียม (K)','ppm'],['ca','แคลเซียม (Ca)','ppm'],['mg','แมกนีเซียม (Mg)','ppm'],['b','โบรอน (B)','ppm'],['cec','CEC','cmol/kg']];
function soilRead(t){const n=k=>t[k]===''||t[k]==null?null:+t[k],out=[],todo=[];let lime=0;
  const pH=n('pH'),om=n('om'),p=n('p'),k=n('k'),ca=n('ca'),mg=n('mg'),b=n('b'),cec=n('cec');
  if(pH!=null){if(pH<4.5){out.push(['pH',pH,'bad','กรดจัด','ธาตุ P, Ca, Mg ถูกล็อก รากไม่โต']);lime=[300,400]}
   else if(pH<5.5){out.push(['pH',pH,'warn','ค่อนข้างกรด','ทุเรียนชอบ 5.5–6.5']);lime=pH<5?[200,300]:[100,200]}
   else if(pH<=6.5)out.push(['pH',pH,'ok','เหมาะกับทุเรียน',''])
   else if(pH<=7.3)out.push(['pH',pH,'warn','ค่อนข้างด่าง','ธาตุเสริม Fe, Zn, Mn, B ดูดได้น้อยลง ห้ามใส่ปูน']);
   else out.push(['pH',pH,'bad','ด่าง','ห้ามใส่ปูน ใช้ปุ๋ยอินทรีย์และกำมะถันผงตามคำแนะนำ'])}
  if(lime)todo.push(`ใส่ปูนโดโลไมต์ประมาณ ${lime[0]}–${lime[1]} กก./ไร่ (≈ ${Math.round(lime[0]/25)}–${Math.round(lime[1]/25)} กก./ต้น) หว่านรอบทรงพุ่ม แบ่งใส่ 2 ครั้งห่างกัน 2–3 เดือน เว้นห่างจากปุ๋ยเคมี 2 สัปดาห์ แล้วตรวจซ้ำใน 6 เดือน (ตัวเลขประมาณ ดินเหนียวต้องใช้มากกว่าดินทราย)`);
  if(om!=null){if(om<1.5){out.push(['om',om,'bad','ต่ำ','ดินอุ้มน้ำและปุ๋ยไม่อยู่ จุลินทรีย์น้อย']);todo.push('เพิ่มอินทรียวัตถุ: ปุ๋ยคอก/ปุ๋ยหมัก 20–30 กก./ต้น/ปี คลุมโคนด้วยฟางหรือเศษใบไม้ ปลูกพืชคลุมดินระหว่างแถว')}
   else if(om<3.5)out.push(['om',om,'warn','ปานกลาง','รักษาระดับด้วยปุ๋ยหมักทุกปี']);else out.push(['om',om,'ok','สูง',''])}
  if(p!=null){if(p<10){out.push(['p',p,'bad','ต่ำ','']);todo.push('P ต่ำ: ช่วงบำรุงต้นใช้ 15-15-15 ช่วงก่อนทำดอกใช้ 8-24-24 และแก้ pH ให้ถึง 5.5 ขึ้นไปก่อน (ดินกรดล็อก P)')}
   else if(p<=25)out.push(['p',p,'warn','ปานกลาง','']);else if(p<=45)out.push(['p',p,'ok','สูง','']);else{out.push(['p',p,'warn','สูงมาก','ใส่ P เพิ่มเปลืองเงิน และไปกดสังกะสี']);todo.push('P สูงแล้ว: ลดปุ๋ยตัวกลาง ใช้สูตรที่ P ต่ำลง')}}
  if(k!=null){if(k<60){out.push(['k',k,'bad','ต่ำ','']);todo.push('K ต่ำ: เพิ่มปุ๋ยตัวท้าย เช่น 13-13-21 หรือ 0-0-60 ช่วงผลโต (K ช่วยรสและเนื้อ)')}else if(k<=120)out.push(['k',k,'warn','ปานกลาง','']);else out.push(['k',k,'ok','สูง',''])}
  if(ca!=null){if(ca<400){out.push(['ca',ca,'bad','ต่ำ','เสี่ยงไส้ซึม ผลแตก']);if(!lime)todo.push('Ca ต่ำ: ใช้ยิปซัม (ไม่เปลี่ยน pH) 50–100 กก./ไร่ และแคลเซียมทางใบช่วงผลเล็ก')}else out.push(['ca',ca,'ok','พอ',''])}
  if(mg!=null){if(mg<60){out.push(['mg',mg,'bad','ต่ำ','ใบแก่เหลืองระหว่างเส้นใบ']);todo.push(lime?'Mg ต่ำ: ปูนโดโลไมต์ที่ใส่แก้กรดจะเพิ่ม Mg ด้วย':'Mg ต่ำ: แมกนีเซียมซัลเฟต (ดีเกลือ) ทางดิน 0.5–1 กก./ต้น หรือทางใบ')}else out.push(['mg',mg,'ok','พอ',''])}
  if(b!=null){if(b<0.5){out.push(['b',b,'bad','ต่ำ','ผลเบี้ยว ช่อดอกแห้ง']);todo.push('B ต่ำ: โบรอนทางใบก่อนดอกบานและช่วงผลเล็ก ตามฉลาก (ใช้เกินเป็นพิษ)')}else out.push(['b',b,'ok','พอ',''])}
  if(cec!=null)out.push(['cec',cec,cec<5?'warn':'ok',cec<5?'ต่ำ (ดินทราย/ลูกรัง)':'พอ',cec<5?'เก็บปุ๋ยได้น้อย ใส่ปุ๋ยน้อยแต่บ่อย':'']);
  if(ca!=null&&mg!=null&&mg>0){const r=(ca/200)/(mg/120);if(r<2)todo.push(`สัดส่วน Ca:Mg = ${nf.format(r)} (ควร 2–7) Mg มากเกินไป Ca ดูดได้ยาก`);else if(r>7)todo.push(`สัดส่วน Ca:Mg = ${nf.format(r)} (ควร 2–7) Mg ถูกกด ระวังใบเหลืองระหว่างเส้นใบ`)}

  h+=`<section class="sec"><div class="sec-h"><h2>สูตรและตัวคำนวณ</h2></div><div class="seg" style="margin-bottom:12px">${BIO.map(b=>`<button data-act="biok" data-v="${b.k}" aria-pressed="${b.k===R.k}">${esc(b.t.replace(/ \(.*\)/,''))}</button>`).join('')}</div>

function bioResHTML(R,q,tank){const I=R.ing(q);let h=`<table class="fl-table" style="margin-bottom:6px"><tbody>${I.map(([n,v,u])=>`<tr><td style="padding:6px 0">${esc(n)}</td><td class="num" style="text-align:right;padding:6px 0;font-weight:700;white-space:nowrap">${amtTxt(v)} ${esc(u)}</td></tr>`).join('')}</tbody></table>`;
  const d=[];if(tank>0){if(R.fol)d.push(`ฉีดใบ: ใส่ <b class="num">${nf.format(Math.round(tank*1000/R.fol))}</b> มล. ต่อน้ำ ${nf.format(tank)} ลิตร`);if(R.soil&&R.k!=='tri')d.push(`รดดิน: ใส่ <b class="num">${nf.format(Math.round(tank*1000/R.soil))}</b> มล. ต่อน้ำ ${nf.format(tank)} ลิตร`);if(R.k==='tri')d.push(`ผสมน้ำรด: เชื้อสด <b class="num">${nf.format(Math.round(tank/200*100)/100)}</b> กก. ต่อน้ำ ${nf.format(tank)} ลิตร`)}
  return h+(d.length?`<p style="margin:6px 0 0">${d.join('<br>')}</p>`:'')}

async function drAct(a,el){
  if(a==='dxclear'){ui.dx={s:[],c:[],tree:''};render();return true}
  if(a==='dxtree'){ui.dx={s:[],c:[],tree:el.dataset.id};ui.planTab='diag';closeSheet();if(location.hash==='#plan')render();else location.hash='plan';return true}
  if(a==='dxsave'){const D=dxState(),id=($('#dxTree')||{}).value;if(!id)return toast('เลือกต้นก่อน'),true;const R=dxRun(D.s,D.c);if(!R.length)return true;
    const sym=DXS.flatMap(g=>g[1]).filter(([k])=>D.s.includes(k)).map(x=>x[1]).join(', ');
    const note='อาการ: '+sym+' | น่าจะเป็น: '+R.slice(0,2).map(x=>x.r[0]+' (มั่นใจ'+x.conf+')').join(', ')+' | เช็ก: '+R[0].r[4];
    if(await put('works',uid(),{date:today(),type:'อื่นๆ',product:'ตรวจอาการ: '+R[0].r[0],rate:'',trees:[id],cost:0,uses:[],phi:0,every:0,useQty:0,note})){toast('บันทึกในประวัติต้นแล้ว');D.tree=id}return true}
  if(a==='soilsave'){const t={id:uid(),date:($('#soDate')||{}).value||today(),plot:(($('#soPlot')||{}).value||'').trim()};let n=0;
    SF.forEach(([k])=>{const v=(($('#so_'+k)||{}).value||'').trim().replace(',','.');t[k]=v===''?'':+v;if(v!==''&&!isNaN(+v))n++});
    if(!n)return toast('ใส่ค่าอย่างน้อย 1 ช่อง'),true;if(t.pH!==''&&(t.pH<2||t.pH>10))return toast('ค่า pH ควรอยู่ระหว่าง 3–9'),true;
    if(await put('meta','soil',{tests:[...soilTests(),t]}))toast('บันทึกผลตรวจดินแล้ว');return true}
  if(a==='soildel'){if(await put('meta','soil',{tests:soilTests().filter(t=>t.id!==el.dataset.id)}))toast('ลบแล้ว');return true}
  if(a==='biok'){ui.bio={...(ui.bio||{}),k:el.dataset.v,q:''};render();return true}
  if(a==='biostart'){const B=ui.bio,R=BIOK[B.k];const q=+B.q>0?+B.q:R.q;if(await put('meta','bio',{batches:[...bioBatches(),{id:uid(),k:R.k,q,start:today(),note:(($('#bioNote')||{}).value||'').trim()}]}))toast('เริ่มหมักแล้ว พร้อมใช้ '+fd(addDays(today(),R.d)));return true}
  if(a==='biodel'){if(await put('meta','bio',{batches:bioBatches().filter(x=>x.id!==el.dataset.id)}))toast('ลบแล้ว');return true}
  if(a==='gobio'){ui.labTab='bio';if(location.hash==='#lab')render();else location.hash='lab';return true}
  if(a==='gosafe'){ui.labTab='chems';if(location.hash==='#lab')render();else location.hash='lab';return true}
  return false}

function solveBlend(c){

  for(let col=0;col<3;col++){let piv=col;for(let r=col+1;r<3;r++)if(Math.abs(A[r][col])>Math.abs(A[piv][col]))piv=r;
    if(Math.abs(A[piv][col])<1e-9)return {err:'แม่ปุ๋ย 3 ตัวนี้ให้ธาตุไม่ครบ N, P, K ลองเลือกให้มีตัวที่ให้ N, ตัวที่ให้ P และตัวที่ให้ K'};

  if(x.some(v=>v<-1e-6)){const bad=x.map((v,i)=>v<0?c.src[i]:null).filter(Boolean);return {err:`ผสมให้ได้สูตรนี้ไม่ได้ เพราะแม่ปุ๋ยตัวอื่นให้ธาตุเกินเป้าไปแล้ว (ต้องใช้ ${bad.join(', ')} ติดลบ) ลองเปลี่ยนแม่ปุ๋ย เช่น ใช้ 0-46-0 แทน 18-46-0`}}
  const used=x.reduce((a,v)=>a+Math.max(0,v),0),filler=W-used;

  return {kg,filler:Math.max(0,filler),W,cost,allPriced,per50:W?cost/W*50:0};
}

function vLedger(){

  let h=`<div class="panel money"><div class="in"><span>รายรับ</span><b>${baht(inc)}</b><small>บาท</small></div><div class="out"><span>รายจ่าย</span><b>${baht(out)}</b><small>บาท</small></div><div><span>คงเหลือ</span><b>${inc-out<0?'−':''}${baht(Math.abs(inc-out))}</b><small>บาท</small></div></div>`;
  if(!L.length)return h+`<div class="panel empty" style="margin-top:14px"><h3>ยังไม่มีรายการเงินในปีนี้</h3><p>ค่าปุ๋ยค่ายาจากหน้า "ฉีดยา/ปุ๋ย" และเงินจากการขายจะมาลงที่นี่เอง ส่วนค่าแรง ค่าไฟ ค่าน้ำมัน จดเพิ่มด้วยปุ่ม "จ่ายเงิน"</p></div>`;
  if(ui.crop&&ui.crop!=='ทั้งสวน')h+=`<p class="muted" style="font-size:13.5px;margin:10px 0 0">แสดงเฉพาะส่วนของ${ui.crop} · รายการที่ใช้ร่วมกัน (ฉีดยา/ใส่ปุ๋ยพร้อมกัน ค่าแรง ค่าน้ำไฟ) แบ่งตามสัดส่วน ${ui.crop==='มังคุด'?Math.round(mgShare()*100):100-Math.round(mgShare()*100)}% ตั้งได้ในแท็บต้นทุน</p>`;
  const cats={};L.filter(r=>r.dir==='out').forEach(r=>cats[r.cat]=(cats[r.cat]||0)+r.amount);
  const ce=Object.entries(cats).sort((a,b)=>b[1]-a[1]);const mx=ce[0]?ce[0][1]:1;
  if(ce.length)h+=`<section class="sec" style="margin-top:20px"><div class="sec-h"><h2>รายจ่ายแยกหมวด</h2></div><div class="panel cat-bars">${ce.map(([c,v])=>`<div><span>${esc(c)}</span><i style="width:${Math.max(2,v/mx*100)}%"></i><em>${baht(v)}</em></div>`).join('')}</div></section>`;
  // monthly
  const months={};L.forEach(r=>{const k=r.date.slice(0,7);(months[k]=months[k]||[]).push(r)});
  h+=`<section class="sec"><div class="sec-h"><h2>รายการทั้งหมด</h2><button class="link" data-act="csv">${''}คัดลอกไป Excel</button></div>`;
  h+=Object.entries(months).sort((a,b)=>a[0]<b[0]?1:-1).map(([k,rs])=>{const i=rs.filter(r=>r.dir==='in').reduce((a,r)=>a+r.amount,0),o=rs.filter(r=>r.dir==='out').reduce((a,r)=>a+r.amount,0);
    return `<div class="sec-h" style="margin-top:18px"><h3 style="margin:0;font-size:16px">${pd(k+'-01').toLocaleDateString('th-TH',{month:'long',year:'numeric'})}</h3><span class="muted" style="font-size:14px">รับ <b style="color:var(--in)">${baht(i)}</b> · จ่าย <b style="color:var(--out)">${baht(o)}</b></span></div><div class="panel"><ul class="list">${rs.map(r=>`<li class="click" data-act="edit" data-c="${r.src}" data-id="${r.id}"><div class="d">${fd(r.date,{day:'numeric',month:'short'})}</div><div><div class="t">${esc(r.title)}</div><div class="s"><span class="kind">${esc(r.cat)}</span>${r.src!=='money'?'มาจากหน้า '+({works:'ฉีดยา/ปุ๋ย',sales:'การขาย',stock:'สต็อก'})[r.src]:''} ${who(r.by)}</div></div><div class="amt ${r.dir}">${r.dir==='in'?'+':'−'}${baht(r.amount)}</div></li>`).join('')}</ul></div>`}).join('');
  return h+`</section>`;
}

let photoUnsub=null;const LPH='durian-photos-v1';
const localPhotos=()=>{try{return JSON.parse(localStorage.getItem(LPH)||'{}')}catch(e){return {}}};
function stopPhotos(){if(photoUnsub){try{photoUnsub()}catch(e){}photoUnsub=null}}
function loadPhotos(id){stopPhotos();
  if(S.mode==='cloud'){const tm=setTimeout(()=>{const el=$('#photos');if(el&&el.dataset.loaded!=='1')el.innerHTML='<p class="muted">ยังโหลดรูปไม่ได้ ลองเปิดใหม่อีกครั้ง</p>'},10000);
    photoUnsub=S.db.collection('photos').where('tree','==',id).onSnapshot(sn=>{clearTimeout(tm);showPhotos(sn.docs.filter(d=>d.exists).map(d=>({id:d.id,...d.data()})))},()=>{clearTimeout(tm);showPhotos([])})}
  else showPhotos(Object.entries(localPhotos()).map(([k,v])=>({id:k,...v})).filter(p=>p.tree===id));
}
function showPhotos(ps){const el=$('#photos');if(!el)return;el.dataset.loaded='1';
  ps=ps.filter(p=>typeof p.img==='string'&&p.img.startsWith('data:image/')).sort((a,b)=>a.date<b.date?1:a.date>b.date?-1:(b.updated||0)-(a.updated||0));
  el.innerHTML=ps.length?ps.map(p=>`<figure><img src="${esc(p.img)}" alt="รูปถ่ายวันที่ ${fd(p.date)}" data-act="bigphoto"><figcaption>${fd(p.date)}${S.canWrite?` · <button type="button" class="link" data-act="delphoto" data-id="${esc(p.id)}">ลบ</button>`:''}</figcaption></figure>`).join(''):'<p class="muted" style="grid-column:1/-1;margin:0">ยังไม่มีรูป ถ่ายใบ ดอก ผล หรือโรคที่เจอเก็บไว้ดูย้อนหลังได้</p>'}
function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{res(im);setTimeout(()=>URL.revokeObjectURL(u),1000)};im.onerror=()=>{URL.revokeObjectURL(u);rej()};im.src=u})}
async function compress(file,maxW,limit){const im=await loadImg(file);let w=Math.min(maxW,im.naturalWidth);
  for(let round=0;round<4;round++){const h=Math.round(im.naturalHeight*w/im.naturalWidth);const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(im,0,0,w,h);
    for(const q of [.8,.7,.6,.5]){const u=c.toDataURL('image/jpeg',q);if(u.length<limit)return u}w=Math.round(w*.75)}
  throw new Error('big')}
async function addPhoto(id,file){toast('กำลังย่อรูป…');let img;try{img=await compress(file,1280,230000)}catch(e){toast('เปิดรูปนี้ไม่ได้');return}
  const doc={tree:id,date:today(),img,updated:Date.now()};if(S.me)doc.by=S.me;
  if(S.mode==='cloud'){try{await S.db.collection('photos').doc(uid()).set(doc);toast('เพิ่มรูปแล้ว')}catch(e){toast(e&&e.code==='quota_exceeded'?'พื้นที่เก็บรูปเต็ม ลองลบรูปเก่า':'เพิ่มรูปไม่สำเร็จ')}}
  else{const all=localPhotos();all[uid()]=doc;try{localStorage.setItem(LPH,JSON.stringify(all));loadPhotos(id);toast('เพิ่มรูปแล้ว')}catch(e){toast('พื้นที่ในเครื่องเต็ม')}}}
function setupSheet(){
  const s=settings();
  openSheet('ตั้งค่าสวน',`<input type="hidden" name="_c" value="setup"><div class="fld"><label class="l" for="o1">ชื่อสวน</label><input class="f" id="o1" name="name" value="${esc(s.name)}"></div>
  <label class="l">จำนวนวันจากดอกบานถึงวันตัด <small>(ใช้คำนวณวันตัด แก้ให้ตรงกับสวนตัวเอง)</small></label>
  <div class="grid2">${VARIETIES.map(v=>`<div class="fld" style="margin-bottom:8px"><label class="l" style="font-weight:500" for="d-${v}">${v}</label><input class="f num" style="font-size:18px" id="d-${v}" name="d:${v}" type="number" min="30" max="200" value="${daysFor(v)}"></div>`).join('')}</div>
  <h3 style="font-size:16px;margin:18px 0 6px">สำรองข้อมูล</h3><p class="muted" style="font-size:14px;margin:0 0 10px">ดาวน์โหลดข้อมูลทั้งหมดเก็บไว้เป็นไฟล์ หรือนำเข้าจากไฟล์สำรอง (รูปถ่ายไม่รวมในไฟล์)</p>
  <div class="row"><button type="button" class="btn" data-act="backup">ดาวน์โหลดไฟล์สำรอง</button><label class="btn">นำเข้าจากไฟล์<input type="file" accept=".json,application/json" data-import hidden></label></div>`,'<span></span>'+saveBtn)}

/* ---------- submit ---------- */
sheet.addEventListener('submit',async e=>{
  e.preventDefault();const f=e.target,fd_=new FormData(f),g=k=>(fd_.get(k)||'').toString().trim();
  const c=g('_c'),id=g('_id')||uid();const prev=(S.data[c]||{})[id]||{};
  const btn=f.querySelector('[type=submit]');btn.disabled=true;btn.textContent='กำลังบันทึก…';
  let ok=false,msg='บันทึกแล้ว';
  if(c==='works'){ok=await put('works',id,{...prev,date:g('date')||today(),type:g('type'),product:g('product'),rate:g('rate'),trees:pickedIds(),cost:+g('cost')||0,uses:(()=>{try{return JSON.parse(g('uses')||'[]')}catch(_){return []}})(),phi:+g('phi')||0,every:+g('every')||0,useQty:+g('useQty')||0,note:g('note')})}
  else if(c==='flowers'){const ids=pickedIds();if(!ids.length){toast('เลือกต้นอย่างน้อย 1 ต้น');btn.disabled=false;btn.textContent='บันทึก';return}
    const stage=g('stage');ok=await put('flowers',id,{...prev,date:g('date')||today(),stage,fruits:stage==='fruit'?(+g('fruits')||null):null,yieldN:stage==='cut'?(+g('yieldN')||null):null,yieldKg:stage==='cut'?(+g('yieldKg')||null):null,trees:ids,note:g('note')})}
  else if(c==='sales'){const lines=readLines();if(!lines.some(l=>l.kg)){toast('ใส่น้ำหนักอย่างน้อย 1 แถว');btn.disabled=false;btn.textContent='บันทึก';return}
    ok=await put('sales',id,{...prev,crop:g('crop')||'ทุเรียน',date:g('date')||today(),mode:g('mode'),buyer:g('buyer'),channel:g('channel'),lines,fee:+g('fee')||0,note:g('note')})}
  else if(c==='money'){const a=+g('amount');if(!(a>0)){toast('ใส่จำนวนเงิน');btn.disabled=false;btn.textContent='บันทึก';return}
    ok=await put('money',id,{...prev,date:g('date')||today(),dir:g('dir'),cat:g('cat'),amount:a,note:g('note'),crop:g('crop')||(g('cat')==='ขายมังคุด'?'มังคุด':'ทั้งสวน')})}
  else if(c==='chems'){if(!g('name')){toast('ใส่ชื่อสาร');btn.disabled=false;btn.textContent='บันทึก';return}
    ok=await put('chems',id,{...prev,name:g('name'),form:g('form')||'OTHER',tags:fd_.getAll('tag'),notMix:fd_.getAll('nm'),rate:+g('rate')||null,rateUnit:g('rateUnit'),phi:+g('phi')||0,packSize:+g('packSize')||null,packUnit:g('packUnit'),packPrice:+g('packPrice')||null,npk:g('npk'),ai:+g('ai')||null,aiName:g('aiName'),note:g('note')});
    if(ok&&ui.chemToMix){ui.mix.items=(ui.mix.items||[]).filter(r=>r.pid);ui.mix.items.push({pid:id,amt:+g('rate')||'',unit:g('rateUnit')||'ซีซี'});saveMix()}ui.chemToMix=false;if(ok){const bb=bannedOf(g('name')+' '+g('aiName'));if(bb&&bb.lv==='bad')setTimeout(()=>toast('คำเตือน: '+bb.name+' '+bb.why),1600)}}
  else if(c==='stock'){const q=+g('qty');if(!g('item')||!(q>0)){toast('ใส่ชื่อของและจำนวน');btn.disabled=false;btn.textContent='บันทึก';return}
    ok=await put('stock',id,{...prev,date:g('date')||today(),item:g('item'),qty:q,unit:g('unit'),kind:g('kind'),cost:+g('cost')||0,note:g('note')})}
  else if(c==='trees'){if(!g('no')){toast('ใส่เบอร์ต้น');btn.disabled=false;btn.textContent='บันทึก';return}
    ok=await put('trees',id,{...prev,no:g('no'),row:g('row'),variety:g('variety'),kind:g('kind'),planted:g('planted'),note:g('note')})}
  else if(c==='trees-bulk'){const st=parseInt(g('start'))||1,n=Math.min(500,parseInt(g('count'))||1);const exist=new Set(trees().map(t=>String(t.no)));let made=0;
    for(let i=0;i<n;i++){const no=g('prefix')+String(st+i);if(exist.has(no))continue;const r=await put('trees',uid(),{no,row:g('row'),variety:g('variety'),kind:g('kind'),planted:g('planted'),created:Date.now()});if(!r)break;made++}
    ok=made>0||n===0;msg=made?`เพิ่ม ${made} ต้นแล้ว`:'เบอร์ซ้ำกับต้นที่มีอยู่';if(!made){toast(msg);btn.disabled=false;btn.textContent='เพิ่มต้น';return}}
  else if(c==='setup'){const days={};VARIETIES.forEach(v=>{const n=+g('d:'+v);if(n)days[v]=n});ok=await put('meta','settings',{name:g('name')||'สวนทุเรียน',days})}
  if(ok){closeSheet();toast(msg);S.writeProven=true}else{btn.disabled=false;btn.textContent='บันทึก'}
});

/* ---------- clicks ---------- */
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;
  if(await planAct(a,el))return;
