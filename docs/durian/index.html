  if(a==='backup'){const out={app:'durian-book',version:1,exported:new Date().toISOString(),data:{}};COLLS.forEach(c=>out.data[c]=S.data[c]);

  if(a==='close')return closeSheet();

  if(a==='stpick'){const v=el.dataset.v;sheet.querySelectorAll('#stseg button').forEach(b=>b.setAttribute('aria-pressed',String(b===el)));sheet.querySelector('[name=stage]').value=v;$('#sthelp',sheet).textContent=ST[v].d;$('#fruitf',sheet).hidden=v!=='fruit';$('#yieldf',sheet).hidden=v!=='cut';return}
  if(a==='smode'||a==='scrop'){const f=$('#sf',sheet);const id=f._id.value;const cur={...(S.data.sales[id]||{}),date:f.date.value,buyer:f.buyer.value,mode:a==='smode'?el.dataset.v:f.mode.value,crop:a==='scrop'?el.dataset.v:f.crop.value,lines:null};return forms.sales(id||null,cur)}
  if(a==='mcrop'){ui.crop=el.dataset.v;return render()}
  if(a==='wcrop'){ui.wcrop=el.dataset.v;return render()}
  if(a==='addline'){$('#ln',sheet).insertAdjacentHTML('beforeend',lineRow({grade:'',kg:'',price:''}));return}
  if(a==='del'){if(!el.classList.contains('arm')){el.classList.add('arm');el.textContent='กดอีกครั้งเพื่อยืนยันลบ';setTimeout(()=>{if(el.isConnected){el.classList.remove('arm');el.textContent='ลบรายการนี้'}},4000);return}
    const c=el.dataset.c,id=el.dataset.id;if(await del(c,id)){closeSheet();toast('ลบแล้ว')}return}
  if(a==='wf'){ui.workFilter=el.dataset.v;return render()}
  if(a==='sf'){ui.stageFilter=el.dataset.v&&ui.stageFilter!==el.dataset.v?el.dataset.v:null;return render()}
  if(a==='mt'){ui.moneyTab=el.dataset.v;return render()}
  if(a==='setup')return setupSheet();
  if(a==='wt'){ui.workTab=el.dataset.v;return render()}
  if(a==='labtab'){ui.labTab=el.dataset.v;return render()}
  if(a==='mixq'){ui.mix[el.dataset.k]=el.dataset.v;saveMix();const i=$(el.dataset.k==='base'?'#mx3':'#mx1');if(i)i.value=el.dataset.v;updMix();return}
  if(a==='mixadd'){ui.mix.items.push({pid:'',amt:'',unit:'ซีซี'});saveMix();return render()}

  if(a==='mixclear'){ui.mix=newMix();saveMix();return render()}
  if(a==='loadrec'){const r=S.data.recipes[el.dataset.id];if(!r)return;ui.mix={...newMix(),...JSON.parse(JSON.stringify(r)),id:el.dataset.id};ui.labTab='mix';saveMix();window.scrollTo(0,0);return render()}
  if(a==='mixsave'){const m=ui.mix;if(!(m.name||'').trim()){toast('ตั้งชื่อสูตรก่อนบันทึก');const n=$('[data-mix=name]');if(n)n.focus();return}
    const items=m.items.filter(r=>r.pid&&S.data.chems[r.pid]).map(r=>({pid:r.pid,amt:+r.amt||0,unit:r.unit}));if(!items.length)return toast('ยังไม่มีสารในสูตร');
    const id=el.dataset.asnew||!m.id?uid():m.id;const prev=S.data.recipes[id]||{};
    if(await put('recipes',id,{...prev,name:m.name.trim(),tank:+m.tank||200,tanks:+m.tanks||1,base:+m.base||20,perTree:+m.perTree||null,items,note:m.note||''})){ui.mix.id=id;saveMix();startMixBanner();toast('บันทึกสูตรแล้ว · ทำตามแบนเนอร์ด้านบนทีละขั้น');render()}return}

    if(await del('recipes',ui.mix.id)){ui.mix.id=null;saveMix();toast('ลบสูตรแล้ว');render()}return}
  if(a==='mixwork'){const r=mixCalc(ui.mix);if(!r.rows.length)return;const tot=r.cost;
    return forms.works(null,{type:'ฉีดยา/สารเคมี',product:(ui.mix.name||'สูตรผสม').trim(),rate:r.rows.map(x=>x.c.name+' '+fmtAmt(x.amt,x.unit)).join(', ')+' /น้ำ '+r.base+' ลิตร · รวม '+nf.format(r.total)+' ลิตร',cost:tot?Math.round(tot*100)/100:'',phi:r.phi||'',uses:r.rows.map(x=>({item:x.c.name,qty:Math.round(x.all*100)/100,unit:x.unit}))})}
  if(a==='starter'){let n=0;const have=new Set(chemList().map(c=>c.name));for(const [name,form,tags] of STARTER){if(have.has(name))continue;if(!await put('chems',uid(),{name,form,tags,notMix:[],note:'รายชื่อเริ่มต้น เช็คชนิดสูตรกับฉลากยี่ห้อที่ใช้'}))break;n++}toast(n?`เพิ่ม ${n} รายการแล้ว ใส่ราคา/อัตราเพิ่มได้`:'มีครบแล้ว');return}
  if(a==='tt'){ui.treeTab=el.dataset.v;ui.mapEdit=false;ui.mapSel=null;return render()}
  if(a==='gostock'){ui.workTab='stock';if(location.hash==='#work')render();else location.hash='work';return}
  if(a==='repeat'){if(!S.canWrite)return;const w=S.data.works[el.dataset.id];if(!w)return;return forms.works(null,{type:w.type,product:w.product,rate:w.rate,trees:w.trees,every:w.every,phi:w.phi,useQty:w.useQty})}
  if(a==='mapedit'){ui.mapEdit=!ui.mapEdit;ui.mapSel=null;return render()}
  if(a==='mapsel'){ui.mapSel=ui.mapSel===el.dataset.id?null:el.dataset.id;return render()}
  if(a==='pin'){if(!ui.mapEdit)return treeSheet(el.dataset.id);ui.mapSel=ui.mapSel===el.dataset.id?null:el.dataset.id;return render()}
  if(a==='mapclick'){if(!ui.mapSel)return toast('เลือกป้ายต้นก่อน แล้วค่อยแตะบนรูป');const r=el.getBoundingClientRect();const mx=Math.round((e.clientX-r.left)/r.width*1000)/10,my=Math.round((e.clientY-r.top)/r.height*1000)/10;const id=ui.mapSel;const t=S.data.trees[id];if(!t)return;
    const wasUn=t.mx==null;const nxt=trees().find(x=>x.id!==id&&(x.mx==null||x.my==null));ui.mapSel=wasUn&&nxt?nxt.id:null;await put('trees',id,{...t,mx,my});render();return}
  if(a==='mapremove'){const id=ui.mapSel,t=S.data.trees[id];if(!t)return;ui.mapSel=null;const {mx,my,...rest}=t;await put('trees',id,{...rest,mx:null,my:null});render();return}
  if(a==='mapreset'){await del('meta','mapimg');toast('กลับไปใช้รูปเดิมแล้ว');return}
  if(a==='bigphoto'){el.closest('figure').classList.toggle('big');return}

});
